name = "mable22-mp"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# 방 1개 = Durable Object 1개, 게임별 빠른 매칭 대기열 1개 (무료 플랜은 SQLite 기반 클래스만 쓸 수 있음)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[vars]
# 접속을 허용할 게임 주소(쉼표로 구분). 비워 두면 어디서나 접속 가능.
# GitHub Pages + Cloudflare(게임 화면 Worker mable22-play, Pages 이름 예비)
ALLOWED_ORIGINS = "https://handj957.github.io,https://mable22-play.handj957.workers.dev,https://mable22.pages.dev,https://mable22-play.pages.dev"
