name = "mable22-mp"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# 방 1개 = Durable Object 1개 (무료 플랜은 SQLite 기반 클래스만 쓸 수 있음)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# 접속을 허용할 게임 주소(쉼표로 구분). 비워 두면 어디서나 접속 가능.
ALLOWED_ORIGINS = "https://handj957.github.io"
