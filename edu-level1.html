(function(){try{

function go(){try{var fe=document.fullscreenElement||document.webkitFullscreenElement;if(fe)return;var p=rq.call(de,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){})}catch(e){}}
function once(){document.removeEventListener('pointerup',once,true);document.removeEventListener('touchend',once,true);go()}
document.addEventListener('pointerup',once,true);document.addEventListener('touchend',once,true);

:root{

  --f-display:'Jua','IBM Plex Sans KR',system-ui,sans-serif;

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-theme="dark"]{--bg:#1b1a22;--panel:#26252f;--panel2:#302e3a;--line:#43404f;--fg:#ece9f2;--muted:#a6a2b4;--accent:#f0864a;--accent2:#58b8b8;--ok:#5cc68c;--warn:#e7b84a;--danger:#ef6c64;--info:#7a9ff0;--dA:#8c6a4c;--dB:#6c8a4e;--dC:#a0783a;--dD:#9c5a56;--dE:#4b7aa2;--dF:#4f8a80;--dG:#9a5676;--dH:#71609e;color-scheme:dark}
*{box-sizing:border-box}

header .sub{display:none}@media (min-width:700px){header .sub{display:block}}
button{font-family:var(--f-body);cursor:pointer}

.board{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(11,minmax(0,1fr)) minmax(0,1.3fr);grid-template-rows:minmax(0,1.3fr) repeat(11,minmax(0,1fr)) minmax(0,1.3fr);gap:2px;width:min(96vw, var(--frameW,480px));height:min(80vh,620px);margin:0 auto;background:var(--line);border:2px solid var(--line);border-radius:14px;overflow:hidden}

.cell.owned::after{content:"";position:absolute;inset:0;border:2px solid var(--own);pointer-events:none}

.cell.corner .nm{font-family:var(--f-display);font-weight:400;font-size:1.15em;color:var(--accent)}

.tokens{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:wrap}
.tok{display:inline-grid;place-items:center;width:clamp(14px,3.6vw,20px);height:clamp(14px,3.6vw,20px);border-radius:50%;background:var(--pc);border:1.5px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.35);font-size:clamp(9px,2.3vw,13px);line-height:1}
.center{grid-area:2/2/13/13;background:var(--panel);border-radius:10px;display:flex;flex-direction:column;align-items:stretch;gap:clamp(4px,1vw,7px);padding:clamp(6px,1.4vw,10px);text-align:center;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;font-size:clamp(10px,1.9vw,12.5px);scrollbar-width:thin}
.cpanel{display:contents}

.cbar{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;min-width:0}

.cbar .rnd small{font-size:.55em;color:var(--muted);font-family:var(--f-mono)}
.cbar .prog{flex:1;min-width:20px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}

.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.9em;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.boom{border-color:var(--ok);color:var(--ok)}.chip.bust{border-color:var(--danger);color:var(--danger)}

.cbody{flex:none;text-align:left;font-size:.98em;padding:2px 2px 14px}

  <h3>📜 기업 일지 <span style="font-size:11px;color:var(--muted);font-weight:400">설립·확장·상장·부도·손익</span></h3>
  <ul class="colog">${(me.coEvents&&me.coEvents.length)?me.coEvents.slice(0,20).map(e=>`<li><span class="lvl">R${e.r}</span> ${esc(e.t)}</li>`).join(''):'<li class="sub">아직 기업 활동이 없습니다. 기업 본사(🏢) 칸에서 회사를 세워 보세요.</li>'}</ul>

 else if(tab==='rank'){const ps=alive().slice().sort((a,b)=>netWorth(b)-netWorth(a));const mx=Math.max(...ps.map(netWorth),1);
  el.innerHTML=`<h2>🏅 순위<span>순자산 기준</span></h2>`+ps.map((p,k)=>`<div class="pl" id="rk-${p.id}" style="--pc:${p.color}"><span>${k+1}위 ${p.emoji}</span><span><b style="font-family:var(--f-body)">${esc(p.name)}</b> ${p.human?'':'<small>'+STRATN[p.strat]+'</small>'}</span><b>${won(netWorth(p))}</b><span class="m">현금 ${won(p.cash)} · 땅 ${landOf(p)} · 건물 ${bldOf(p)} · 기업 ${Object.values(p.comp).filter(Boolean).length} · 교육 ${EDUN[p.edu]} · 대출 ${won(p.debt)} · 독점 ${monopolies(p).length}</span><span class="m" style="grid-column:2/4"><span class="bar"><i style="width:${Math.round(netWorth(p)/mx*100)}%"></i></span></span></div>`).join('')+
  `<h3>AI 상대</h3>${S.players.filter(p=>!p.human).map(p=>`<div class="sub">${p.emoji} ${esc(p.name)} · ${STRATN[p.strat]}: ${STRATD[p.strat]}</div>`).join('')}`}
 else if(tab==='dex'){S._dexNew=false;el.innerHTML=`<h2>📘 개념 도감<span>${dexN()}/${DEX.length}${dexN()===DEX.length?' · 🎓 네오 아틀라스 마스터':''}</span></h2><div class="dex">${DEX.map(d=>S.dex[d.id]?`<div class="dcard got"><h4>${d.e} ${d.n}</h4>${d.def}<small>예: ${d.ex}</small><small>R${S.dex[d.id]}에 획득</small></div>`:`<div class="dcard lock"><h4>❓ ???</h4><small>${d.how}</small></div>`).join('')}</div>`}
 else el.innerHTML=rulesHTML()}
function cellDetail(){if(selected==null)return'';const i=selected,c=CELLS[i],pr=S.props[i],o=pr?S.players[pr.owner]:null;let d=`<div class="detail"><h2>${c.d?DIST[c.d].e:CEM[c.t]} ${esc(c.name)}<span>${c.d?DIST[c.d].n+' 구역 ('+c.d+')':'기능 칸'} · ${i}번</span></h2><dl>`;
 if(c.t==='land'){d+=`<dt>시세</dt><dd>${won(priceOf(i))} (기준 ${won(c.price)})</dd><dt>반응</dt><dd>${esc(DIST[c.d].note)}</dd><dt>주인</dt><dd>${o?`${o.emoji} ${esc(o.name)} · ${BLD[pr.level]}${ownsAll(o,c.d)?' · 독점 ×2':''}`:'없음'}</dd><dt>통행료</dt><dd>${o?won(rent(i,null))+' — '+esc(rentWhy(i)):won(Math.round(c.price*.1))+' (땅만)'}</dd><dt>건설비</dt><dd>상가 ${won(buildCost(i,1))} · 빌딩 ${won(buildCost(i,2))} · 랜드마크 ${won(buildCost(i,3))}</dd>`}
 else if(c.t==='transit')d+=`<dt>가격</dt><dd>${won(c.price)}</dd><dt>통행료</dt><dd>보유 수에 따라 ₵25 → 50 → 100 → 200</dd><dt>주인</dt><dd>${o?o.emoji+' '+esc(o.name):'없음'}</dd>`;
 else if(c.t==='util')d+=`<dt>가격</dt><dd>${won(c.price)}</dd><dt>통행료</dt><dd>주사위 × ₵10 (둘 다 가지면 ×₵25)${c.kind==='power'?' · 석유 시세 반영':''}</dd><dt>주인</dt><dd>${o?o.emoji+' '+esc(o.name):'없음'}</dd>`;
 else d+=`<dt>효과</dt><dd>${{start:'지나가면 ₵150, 도착하면 ₵75 더',rest:'1~2턴 쉬기(7 이상 굴리면 출발)',fund:'쌓인 세금을 모두 가져감',hyper:'다음 턴 원하는 칸으로 이동',hq:`${SECT[c.sector]?SECT[c.sector].n:''} 기업 설립·확장 (₵150 → 300 → 500)`,bank:c.kind==='save'?'예금 보너스 이자 + 대출·상환':'대출·상환',xch:(c.goods||[]).map(k=>COM[k].n).join('·')+' 1단위씩 사고팔기',edu:'교육 +1 (₵200 → 300)',stock:'남의 기업 지분 20% 사기 → 이익의 25% 배당',auction:'빈 땅 하나를 경매(시작가 시세 60%)',ins:'재해 보험 ₵40 — 다음 재해 피해 면제',tax:c.kind==='income'?'현금의 10% → 복지기금':'건물 1동당 ₵20 → 복지기금',news:'경제 뉴스 카드 1장(호재·악재)',quiz:'경제 상식 문제, 맞히면 ₵50(+교육×₵10)'}[c.t]}</dd>`;
 return d+'</dl></div>'}
function flows(){const f=[];const me=S.players[0];
 f.push(`<div id="fl-rate"><span>금리 ${S.rate.toFixed(2)}%</span><em>→</em><span>이자 ${S.rate.toFixed(2)}%/R</span><em>·</em><span>주거단지(D) 시세 ${Math.round(clamp(1-(S.rate-4)*.05,.6,1.3)*roundMod('dMod')*100)}%</span><em>·</em><span>금융가(G) 통행료 +${Math.round(Math.max(0,S.rate-4)*5)}%</span></div>`+whyD('금리는 돈을 빌리는 값이에요. 오르면 빚 이자가 늘고 집을 사기 어려워져 주거단지는 내리지만, 예금 이자를 노리는 금융가는 오릅니다.'));
 f.push(`<div id="fl-com"><span>원자재 ${Object.keys(COM).map(k=>COM[k].e+S.mkt[k]).join(' ')}</span><em>→</em><span>건설비 ×${(S.mkt.steel/100).toFixed(2)}</span><em>·</em><span>기업 원가</span><em>·</em><span>전통시장 ×${(S.mkt.food/100).toFixed(2)} · 항만 석유 ${S.mkt.oil}</span></div>`+whyD('원자재는 물건을 만드는 재료값이에요. 철강이 오르면 건물 짓는 값과 기업 원가가 함께 오르고, 원자재를 쌀 때 사 둔 사람은 이익을 봅니다.'));
 f.push(`<div id="fl-edu"><span>교육 ${EDUN[me.edu]}</span><em>→</em><span>생산성 +${me.edu*5}%</span><em>→</em><span>기업 이익 ${won(Object.keys(SECT).reduce((a,s)=>a+compProfit(me,s).profit,0))}/R</span><em>→</em><span>재투자</span><em>·</em><span>대학가(B) 통행료 +${me.edu*10}%</span></div>`+whyD('교육을 받으면 같은 일을 더 잘하게 되어(생산성↑) 기업 이익이 늘고, 그 돈을 다시 투자하면 더 커지는 선순환이 생깁니다.'));
 f.push(`<div id="fl-boom"><span>${phaseN()}</span><em>→</em><span>스카이라인(H) 통행료 ×${S.boom>0?1.5:S.boom<0?.5:1}</span><em>·</em><span>항만(E) ×${boomF()}</span><em>·</em><span>기업 매출 ×${boomF()}</span></div>`+whyD('경기가 좋으면 사람들이 소비를 늘려 관광·물류 통행료와 기업 매출이 함께 오르고, 나쁘면 함께 내립니다.'));
 f.push(`<div id="fl-infl"><span>인플레 ${S.infl.toFixed(1)}%</span><em>→</em><span>${S.infl>=3.5?'다음 결산 금리 인상 압력':S.infl<=1.5?'다음 결산 금리 인하 여지':'금리 유지'}</span><em>→</em><span>1번 연결로</span></div>`+whyD('물가가 계속 오르면 중앙은행이 금리를 올려 돈의 흐름을 줄입니다. 그러면 첫 줄(금리)로 이어져 순환합니다.'));
 if(Object.entries(S.props).some(([i,pr])=>pr.owner===me.id&&CELLS[i].t==='util'))f.push(`<div id="fl-syn"><span>전력공사</span><em>→</em><span>석유 ${S.mkt.oil} 연동</span><em>·</em><span>기업 보유</span><em>→</em><span>같은 업종 구역 통행료 +10%</span></div>`+whyD('전력공사는 석유를 써서 통행료가 석유 시세를 따라가고, 같은 업종 기업을 가진 사람은 그 구역 통행료도 10% 더 받습니다.'));
 return f.join('')}
function rulesHTML(){return`<div class="rule"><h2>📖 규칙 (2쪽)<span>Level 1 · 부자 되기 · 교육판</span></h2>
 <h3>목표</h3><p>2101년 메가시티 '네오 아틀라스'의 사업가가 되어 <b>${S.maxRounds}라운드 뒤 순자산 1위</b>를 노립니다. 상대가 전원 파산하거나 <b>구역 2개를 독점</b>하면 즉시 승리합니다. 나라·전쟁·외교는 없고, 돈이 어떻게 도는지만 다룹니다.</p>
 <h3>한 턴</h3><ul><li>(선택) 내 땅 1곳에 건물을 짓습니다(한 턴에 1곳). 그다음 <b>이동 주사위(12면)</b>를 굴려 시계 방향으로 가고 도착 칸을 처리합니다. 월급날을 지나면 ₵150.</li><li>이어서 <b>경제 주사위(12면)</b>가 바로 굴러갑니다. 높을수록 경기 지수(0~100)가 오르고(65 이상 호황, 35 이하 불황) 원자재 한 종류가 움직입니다.</li><li>빈 땅: 시세로 매입. 내 땅: 건물 건설(상가 → 빌딩 → 랜드마크, 통행료 ×2.5 → ×5 → ×9). 남의 땅: 통행료.</li><li>같은 구역의 3칸을 모두 가지면 통행료 2배 + 완성 보너스.</li></ul>
 <h3>6구역과 반응 지표</h3><div class="scroll"><table class="tbl"><tr><th>구역</th><th>기준가</th><th>반응</th></tr>${Object.keys(DIST).map(d=>`<tr><td>${DIST[d].e} ${d} ${DIST[d].n}</td><td class="n">${won(DIST[d].price)}</td><td>${esc(DIST[d].note)}</td></tr>`).join('')}</table></div><p>주거단지(D)와 금융가(G)는 금리에 반대로 움직입니다. 둘을 같이 가지면 금리 변화에 버티는 분산 투자가 됩니다.</p>
 <h3>기능 칸</h3><ul><li>🏢 <b>기업 본사 4곳</b>(제조·IT·식품·관광): 스타트업 ₵150 → 중견 ₵300 → 대기업 ₵500. 라운드 이익 = 매출 × 생산성(교육 1단계마다 +5%) × 경기 국면 승수 − 원자재 원가. 같은 업종 구역(IT↔대학가, 식품↔전통시장, 제조↔항만, 관광↔스카이라인) 통행료 +10%.</li>
 <li>🏦 <b>은행 2곳</b>: 대출(₵300·600)과 상환. 이자는 라운드마다 대출 × 금리. 저축은행은 예금 보너스 이자.</li>
 <li>📦 <b>원자재 거래소 2곳</b>: 석유·식량 / 철강·반도체를 시세로 1단위씩 사고팝니다(최대 5).</li>
 <li>📚 <b>교육 2곳</b>: 기초 → 전문 → 석사(₵200·300). 생산성, 대학가 통행료, 퀴즈 상금이 오릅니다.</li>
 <li>📈 증권거래소: 남의 기업 지분을 사면 이익의 25%를 배당으로${S.opt.adv?'. 심화: 상장·유상증자로 자금 조달':''}. 🔨 경매장 · 🛡️ 보험사(₵40, 다음 재해 면제) · 🧾 세금(복지기금 적립) · 🏝️ 휴가섬 · 🚄 하이퍼루프.</li>
 <li>📰 경제 뉴스 5곳: 카드 24장(호재·악재 12쌍). ❓ 경제 퀴즈 2곳: 맞히면 ₵50(+교육×₵10), 문제는 24개를 돌아가며 나옵니다.</li></ul>
 ${S.opt.dex?'<h3>📘 개념 도감 12개</h3><p>처음 경험한 경제 개념은 도감에 모입니다. 다 모으면 칭호를 받습니다.</p>':''}

<script id="fitcellsjs">(function(){

    g.gain.setValueAtTime(gain,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(.0001,t+dur)}
  var n=osc;
  if(o.lp){var f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;osc.connect(f);n=f}
  n.connect(g);g.connect(bus);
  if(o.send&&bus===musicBus){var s=ctx.createGain();s.gain.value=o.send;g.connect(s);s.connect(dsend)}
  osc.start(t);osc.stop(t+dur+.05);
}
function noise(t,dur,hp,gain){
  var s=ctx.createBufferSource();s.buffer=noiseBuf;
  var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  var g=ctx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(musicBus);s.start(t);s.stop(t+dur+.02);
}
function kick(t,g){
  var o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  var e=ctx.createGain();e.gain.setValueAtTime(.35*g,t);e.gain.exponentialRampToValueAtTime(.0001,t+.22);
  o.connect(e);e.connect(musicBus);o.start(t);o.stop(t+.25);
}
function playStep(n,t){
  var P=CFG,s=n%16,bar=Math.floor(n/16)%P.prog.length;
  var ch=P.prog[bar],tones=Q[ch[1]],root=P.key+ch[0];
  var sd=60/P.bpm/4,barDur=sd*16;
  if(s===0){
    tones.forEach(function(x){tone(t,F(root+x-12),barDur*1.02,{type:P.pad.t,gain:P.pad.g,att:barDur*.25,rel:barDur*.3,lp:P.pad.lp,send:.25,detune:(Math.random()-.5)*8})});
  }
  if(P.bass.pat.charAt(s)==='1'){
    var five=(Math.floor(n/4)%2===1&&P.swing>0)?7:0;
    tone(t,F(root-24+five),sd*2.2,{type:P.bass.t,gain:P.bass.g,att:.01,rel:.12,lp:600});
  }
  if(P.arp.pat.charAt(s)==='1'){
    var i=(Math.floor(s/2)+bar)%tones.length;
    tone(t,F(root+tones[i]+12*P.arp.oct),sd*(P.arp.pl?1.6:1.1),{type:P.arp.t,gain:P.arp.g,pluck:!!P.arp.pl,send:.35,lp:3500});
  }
  if(P.lead.mask.charAt(s)==='1'){
    var sc=SC[P.sc],d=leadSeq[(bar*16+s)%64],note=P.key+sc[d%sc.length]+12*Math.floor(d/sc.length);
    tone(t,F(note),sd*(P.lead.pl?2:3),{type:P.lead.t,gain:P.lead.g,pluck:!!P.lead.pl,att:.02,rel:.15,send:.4,lp:4000});
  }
  var g=P.dr.g;
  if(P.dr.k.charAt(s)==='1')kick(t,g);
  if(P.dr.s.charAt(s)==='1'){noise(t,.12,1800,.12*g);tone(t,190,.08,{type:'triangle',gain:.06*g,pluck:true})}
  if(P.dr.h.charAt(s)==='1')noise(t,.04,7000,.05*g*(s%4===0?1.3:1));
}
function sched(){
  if(!playing||!ctx)return;
  var sd=60/CFG.bpm/4;
  while(nextT<ctx.currentTime+.15){
    playStep(stepN,nextT+((stepN%2)?CFG.swing*sd:0));
    nextT+=sd;stepN++;
  }
}
function startMusic(){
  if(playing||muted||!unlocked||!init())return;
  try{ctx.resume()}catch(e){}
  var r=rng(CFG.id.charCodeAt(0)*31+CFG.id.charCodeAt(1)),n=SC[CFG.sc].length,d=Math.floor(n/2);
  leadSeq=[];for(var i=0;i<64;i++){d+=Math.floor(r()*5)-2;d=Math.max(0,Math.min(n+2,d));leadSeq.push(d)}
  stepN=0;nextT=ctx.currentTime+.1;playing=true;
  var t=ctx.currentTime;musicBus.gain.cancelScheduledValues(t);musicBus.gain.setValueAtTime(.0001,t);musicBus.gain.linearRampToValueAtTime(1,t+.8);
  timer=setInterval(sched,40);
}
function stopMusic(){
  if(!playing)return;
  playing=false;clearInterval(timer);timer=null;
  if(ctx){var t=ctx.currentTime;musicBus.gain.cancelScheduledValues(t);musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(.0001,t+.35)}
}
function sfx(kind){
  if(muted)return;
  var now=Date.now(),gap=kind==='win'?2000:kind==='popup'?500:450;
  if(last[kind]&&now-last[kind]<gap)return;
  last[kind]=now;
  if(!init())return;
  try{ctx.resume()}catch(e){}
  var k=CFG.key,t=ctx.currentTime+.02,o={bus:sfxBus};
  if(kind==='popup'){tone(t,F(k+19),.55,{bus:sfxBus,type:'sine',gain:.16,pluck:true});tone(t+.13,F(k+24),.7,{bus:sfxBus,type:'sine',gain:.14,pluck:true})}
  if(kind==='good'){[0,4,7,12,16].forEach(function(x,i){tone(t+i*.075,F(k+12+x),.35,{bus:sfxBus,type:'triangle',gain:.14,pluck:true})})}
  if(kind==='bad'){[7,3,0].forEach(function(x,i){tone(t+i*.17,F(k+x),.5,{bus:sfxBus,type:'sawtooth',gain:.09,lp:900,att:.02,rel:.3})})}
  if(kind==='win'){[[0,0],[.22,5],[.44,7]].forEach(function(a){[0,4,7,12].forEach(function(y){tone(t+a[0],F(k+12+a[1]+y),1.1,{bus:sfxBus,type:'triangle',gain:.08,att:.02,rel:.7})})});
    tone(t+.7,F(k+31),1.2,{bus:sfxBus,type:'sine',gain:.1,pluck:true})}
}

/* ---- 도입 화면에서만 BGM ---- */
function isIntro(){try{return !!(!document.body.classList.contains('playing'))}catch(e){return false}}
var btn=document.createElement('button');
btn.id='m22snd';btn.type='button';btn.setAttribute('aria-label','소리 켜기/끄기');
btn.style.cssText='position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:2147483000;width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.92);font-size:20px;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)';
function paint(){btn.textContent=muted?'🔇':'🔊'}
btn.addEventListener('click',function(e){
  e.stopPropagation();muted=!muted;
  try{localStorage.setItem('m22_mute',muted?'1':'0')}catch(x){}
  unlocked=true;paint();check();
});
var busy=false;
function check(){
  if(busy)return;busy=true;
  try{ __check() }finally{ busy=false }
}
function __check(){
  var intro=isIntro();
  if(intro&&!muted&&unlocked)startMusic();else stopMusic();
  if(btn.hidden===intro)btn.hidden=!intro; /* 값이 바뀔 때만 써서 감시자가 반복되지 않게 함 */
}
function unlock(){
  if(unlocked)return;unlocked=true;
  if(init()){try{ctx.resume()}catch(e){}}
  check();
}
['pointerdown','touchstart','keydown','click'].forEach(function(ev){document.addEventListener(ev,unlock,true)});
document.addEventListener('visibilitychange',function(){
  if(!ctx)return;
  if(document.hidden){try{ctx.suspend()}catch(e){}}else{try{ctx.resume()}catch(e){}}
});
function boot(){
  document.body.appendChild(btn);paint();check();
  try{new MutationObserver(check).observe(document.body,{attributes:true,subtree:true,attributeFilter:['hidden','class']})}catch(e){}
  setInterval(check,700);
}
if(document.body)boot();else document.addEventListener('DOMContentLoaded',boot);

/* ---- 게임 중 효과음 연결 ---- */
var once=(typeof WeakSet==='function')?new WeakSet():null;
function overOnce(o,fn){if(!o||typeof o!=='object')return;if(once){if(once.has(o))return;once.add(o)}fn()}
function wrap(name,fn){
  try{
    var orig=window[name];
    if(typeof orig!=='function')return;
    window[name]=function(){
      var r;
      try{fn.apply(this,arguments)}catch(e){}
      r=orig.apply(this,arguments);
      return r;
    };
  }catch(e){}
}

wrap('fxMoney',function(p,a){if(p&&p.human&&a)sfx(a>0?'good':'bad')});
wrap('ask',function(prompt){if(!/^\uD83C\uDFB2/.test(String(prompt)))sfx('popup')});
wrap('fxNews',function(){sfx('popup')});
wrap('showResult',function(){var w=S&&S.winner;overOnce(S,function(){sfx(w&&w.human?'win':'bad')})});

window.M22={sfx:sfx,isPlaying:function(){return playing},isIntro:isIntro};
})();
</script>
