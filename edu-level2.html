<title>22세기 브르마블 · Level 2 교육판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout(교육판): 13×13 테두리 보드(48칸)가 화면을 채우고, 가운데 11×11 칸에 현황·행동·탭이 들어간다 */
:root{
  --bg:#e7f0e6; --board:#d4e4d1; --cell:#fbfdf8; --ink:#1d2b22; --muted:#5d6f62;
  --green:#1f6a43; --orange:#e2711d; --line:#b9cdb7; --panel:#f6faf3;
  --bad:#c8392b; --warn:#d99a12; --good:#2c8a4f;
  --d-mv:#e2711d; --d-ec:#2f6fd6; --d-so:#a03fbf;
  --hero:#143d2a; --hero-ink:#eaf4ec; --hero-mute:#a9c7b2; --card:#ffffff; --shadow:0 1px 2px rgba(20,61,42,.08),0 6px 18px rgba(20,61,42,.08);
  --f-disp:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a14; --board:#17251c; --cell:#1e2d23; --ink:#e4efe5; --muted:#93a897;
  --green:#5fc48a; --orange:#f39445; --line:#2d4234; --panel:#18261d;
  --bad:#ef6a5c; --warn:#f0bd45; --good:#5fc48a; --d-mv:#f39445; --d-ec:#6ea2ff; --d-so:#d08cf0; --hero:#0b2418; --hero-ink:#e4efe5; --hero-mute:#8fb39b; --card:#1b2a20; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a14; --board:#17251c; --cell:#1e2d23; --ink:#e4efe5; --muted:#93a897;
  --green:#5fc48a; --orange:#f39445; --line:#2d4234; --panel:#18261d;
  --bad:#ef6a5c; --warn:#f0bd45; --good:#5fc48a; --d-mv:#f39445; --d-ec:#6ea2ff; --d-so:#d08cf0; --hero:#0b2418; --hero-ink:#e4efe5; --hero-mute:#8fb39b; --card:#1b2a20; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
#app{height:100%;width:min(100%,var(--frameW,600px));margin:0 auto;position:relative}
#board{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(11,minmax(0,1fr)) minmax(0,1.25fr);grid-template-rows:minmax(0,1.2fr) repeat(11,minmax(0,1fr)) minmax(0,1.2fr);
  gap:2px;height:100%;background:var(--board);padding:2px;border-radius:10px;border:1px solid var(--line)}
.cell{position:relative;background:var(--cell);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4px 1px 1px;cursor:pointer;min-width:0;border:1px solid transparent}
.cell .band{position:absolute;top:0;left:0;right:0;height:4px}
.cell .ic{font-size:13px;line-height:1}
.cell .nm{font-size:7.5px;line-height:1.05;text-align:center;letter-spacing:-.3px;word-break:keep-all;color:var(--ink);margin-top:1px}
.cell.corner{background:color-mix(in srgb,var(--orange) 14%,var(--cell))}
.cell.corner .ic{font-size:17px}
.cell.corner .nm{font-family:var(--f-disp);font-size:9px}
.cell .own{position:absolute;right:1px;bottom:0;font-size:8px;font-weight:700;line-height:1}
.cell .tk{display:none}
#pawns{position:absolute;inset:0;pointer-events:none;z-index:3}
.pawn{position:absolute;left:0;top:0;width:var(--pw);height:calc(var(--pw)*1.35);transform:translate(-50%,-95%);transition:left .16s ease-out,top .16s ease-out;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.35))}
.pawn svg{width:100%;height:100%;display:block;overflow:visible}
.pawn .body{transform-origin:50% 100%}
.pawn.hop .body{animation:hop .16s ease-out}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-28%) scale(1.05,.95)}100%{transform:translateY(0)}}
.pawn.now{z-index:2}
.pawn.now .body{animation:bob 1.1s ease-in-out infinite}
.pawn.now.hop .body{animation:hop .16s ease-out}
@keyframes bob{50%{transform:translateY(-12%)}}
.pawn .ring{transform-origin:50% 50%;animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.pawn .tagn{position:absolute;left:50%;bottom:calc(100% + 1px);transform:translateX(-50%);font-size:9px;font-weight:700;color:#fff;background:var(--pc);border-radius:6px;padding:0 4px;white-space:nowrap;line-height:1.5}
.pawn.out{opacity:.25}
@media (prefers-reduced-motion:reduce){.pawn{transition:none}.pawn .body,.pawn .ring{animation:none!important}}
.cell .tk i{width:7px;height:7px;border-radius:50%;border:1px solid var(--cell);display:block}
.cell.here{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.cell.hit{animation:hit .8s ease}
@keyframes hit{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.cell.target{outline:2px dashed var(--orange);outline-offset:-2px}

.center{grid-column:2/13;grid-row:2/13;display:flex;flex-direction:column;gap:5px;overflow-y:auto;padding:5px 3px;min-width:0;
  -webkit-overflow-scrolling:touch}
.hud{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;font-size:10px;min-width:0;overflow:hidden}
.hud .ttl{font-family:var(--f-disp);font-size:14px;color:var(--green);margin-right:auto;line-height:1;white-space:nowrap}
.hud .chip{padding:1px 5px;font-size:9.5px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.b-good{color:var(--good)} .chip.b-bad{color:var(--bad)} .chip.b-warn{color:var(--warn)}
.strip{display:grid;gap:2px;font-size:10.5px;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:14px minmax(0,1fr) 58px 34px 34px 26px;gap:3px;align-items:center;padding:1px 4px;border-radius:5px;background:var(--panel);font-size:10px;line-height:1.35}
.prow.now{background:color-mix(in srgb,var(--orange) 18%,var(--panel))}
.prow.out{opacity:.4;text-decoration:line-through}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow .r{text-align:right}
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 4px 2px;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:4px;align-items:baseline}
.tile .k{font-size:8.5px;color:var(--muted);white-space:nowrap}
.tile .bar,.tile .s{grid-column:1/-1}
.tile .v{font-family:var(--f-disp);font-size:13px;text-align:right;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .bar{height:3px;border-radius:2px;background:var(--line);margin-top:1px;overflow:hidden}
.tile .bar i{display:block;height:100%}
.tile.warn{border-color:var(--warn)} .tile.crit{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.tile .s{font-size:8px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{background:var(--panel);border:2px solid var(--green);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:4px}
.act .who{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:15px}
.act .who.go{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;width:100%;text-align:left}
.act .who.go .die{color:var(--ink)}
.act .who.go b{font-weight:400;margin-left:2px}
.dice{display:flex;gap:4px;margin-left:auto}
.die{min-width:24px;border-radius:5px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;font-family:var(--f-disp);font-size:13px;line-height:1;padding:2px 3px 1px}
.die small{font-size:7px;color:var(--muted);font-family:var(--f-body);white-space:nowrap;margin-top:1px}
.act .who{white-space:nowrap;min-width:0}
.act .who .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.act .who.go{font-size:14px}
.msg{font-size:12px;line-height:1.4}
.msg b{color:var(--orange)}
.chain{font-size:11px;color:var(--green);line-height:1.35}
.btns{display:flex;flex-direction:column;gap:4px}
.btn{display:flex;justify-content:space-between;gap:6px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--cell);
  border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;min-height:34px}
.btn .sb{font-size:10px;color:var(--muted);text-align:right}
.btn.main{background:var(--orange);border-color:var(--orange);color:#fff;font-family:var(--f-disp);font-size:16px;justify-content:center}
.btn.alt{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.report{font-size:9.5px;line-height:1.35;background:color-mix(in srgb,var(--green) 9%,var(--panel));border-radius:6px;padding:4px 6px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:6px 6px 0 0;padding:4px 0;font-size:11px;cursor:pointer;min-width:0;white-space:nowrap}
.tab.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.tbody{background:var(--panel);border:1px solid var(--line);border-radius:0 0 8px 8px;padding:6px;font-size:11px;line-height:1.45;min-height:120px}
.tbody h4{font-family:var(--f-disp);font-weight:400;font-size:14px;margin:6px 0 2px;color:var(--green)}
.tbody h4:first-child{margin-top:0}
.tbody table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbody td,.tbody th{padding:2px 3px;border-bottom:1px solid var(--line);text-align:left;font-size:10.5px}
.tbody th{color:var(--muted);font-weight:600}
.log div{padding:1px 0;border-bottom:1px dotted var(--line)}
.log .rd{color:var(--orange);font-weight:700}
.meter{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 4px}
.meter i{display:block;height:100%}
.info{border:1px dashed var(--orange);border-radius:8px;padding:5px 6px;font-size:11px;line-height:1.4}
.info b{font-family:var(--f-disp);font-weight:400;font-size:14px}
.ol{padding-left:16px;margin:2px 0}

#setup{position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:5;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.su{display:flex;flex-direction:column;gap:18px;padding:4px 0 12px}
.hero{position:relative;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:12px;overflow:hidden}
.mini{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:repeat(13,minmax(0,1fr));gap:2px;aspect-ratio:13/8.4;width:100%}
.mini i{border-radius:2px;background:var(--mc);opacity:.95;transition:transform .25s,box-shadow .25s}
.mini i.c{border-radius:4px;background:color-mix(in srgb,var(--orange) 70%,var(--hero))}
.mini i.on{transform:scale(1.25);background:var(--orange);box-shadow:0 0 0 2px var(--hero),0 0 10px 1px color-mix(in srgb,var(--orange) 70%,transparent);z-index:1}
.mini .core{grid-column:2/13;grid-row:2/13;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.18em;font-weight:700;color:var(--orange)}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,10vw,46px);line-height:1;margin:4px 0 2px;letter-spacing:-.01em;color:var(--hero-ink)}
.hero .tag{font-size:12.5px;color:var(--hero-mute);line-height:1.45}
.hero .tag b{color:var(--hero-ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;border-top:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent);padding-top:9px}
.stats div{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.stats div+div{border-left:1px solid color-mix(in srgb,var(--hero-ink) 14%,transparent)}
.stats b{font-family:var(--f-disp);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:10px;color:var(--hero-mute);white-space:nowrap}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.sh h2{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:0;color:var(--ink)}
.sh span{font-size:11px;color:var(--muted)}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border:1px solid transparent;min-width:0}
.st.me{border-color:var(--pc)}
.st .top{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--pc);font-size:15px;font-weight:700}
.st input{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:3px 0}
.st input:focus{outline:none;border-bottom-color:var(--pc)}
.tg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:999px;padding:2px;gap:2px}
.tg button{border:0;background:transparent;border-radius:999px;padding:5px 0;font-size:12px;cursor:pointer;color:var(--muted)}
.tg button.on{background:var(--pc);color:#fff;font-weight:600}
.st .meta{font-size:10px;color:var(--muted);line-height:1.3;min-height:13px}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.df{background:var(--card);border-radius:14px;padding:10px 8px;box-shadow:var(--shadow);cursor:pointer;text-align:left;border:1.5px solid transparent;display:flex;flex-direction:column;gap:6px;min-width:0}
.df.on{border-color:var(--green)}
.df b{font-family:var(--f-disp);font-weight:400;font-size:17px;color:var(--ink)}
.ratio{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line)}
.ratio i{display:block;height:100%}
.df small{font-size:10px;color:var(--muted)}
details.adv{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
details.adv summary{list-style:none;cursor:pointer;padding:12px;display:flex;align-items:center;gap:8px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary h2{font-family:var(--f-disp);font-weight:400;font-size:17px;margin:0}
details.adv summary .sum{font-size:10.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
details.adv summary .chev{transition:transform .2s;color:var(--muted)}
details.adv[open] summary .chev{transform:rotate(180deg)}
details.adv .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:4px}
.cta{position:sticky;bottom:0;margin-top:auto;padding:12px 0 6px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:8px}
.cta .go{flex:1;border:0;border-radius:14px;background:#d9661a;color:#fff;font-family:var(--f-disp);font-size:20px;padding:13px 10px;cursor:pointer;box-shadow:0 6px 16px color-mix(in srgb,var(--orange) 35%,transparent);display:flex;align-items:center;justify-content:center;gap:8px}
.cta .go small{font-family:var(--f-body);font-size:11px;opacity:.85}
.cta .resume{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:13px;font-weight:600}
.cta .resume small{font-size:10px;color:var(--muted);font-weight:400}
.foot{font-size:10.5px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.mini i{transition:none}}
.seat{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
.seat input{width:100%;min-width:0;font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--cell);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--cell);padding:6px 10px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.keyfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-size:12px}
.keyfacts div{background:var(--panel);border-radius:8px;padding:6px 8px;border:1px solid var(--line)}
.keyfacts b{display:block;font-family:var(--f-disp);font-weight:400;font-size:15px;color:var(--orange)}
.over{border:2px solid var(--orange);border-radius:10px;padding:8px;background:color-mix(in srgb,var(--orange) 10%,var(--panel))}
.over h3{font-family:var(--f-disp);font-weight:400;font-size:20px;margin:0 0 4px;color:var(--orange)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#fx svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{position:absolute;border:2px solid var(--rc,var(--orange));border-radius:50%;transform:translate(-50%,-50%);animation:rg 1.3s ease-out forwards}
@keyframes rg{from{width:8px;height:8px;opacity:.95}to{width:230px;height:230px;opacity:0}}
.fxpop{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;animation:pp 1.1s ease-out forwards;border:1px solid currentColor;z-index:2}
.fxpop.g{background:color-mix(in srgb,var(--good) 18%,var(--cell));color:var(--good)}
.fxpop.b{background:color-mix(in srgb,var(--bad) 16%,var(--cell));color:var(--bad)}
@keyframes pp{0%{opacity:0;margin-top:8px}14%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-14px}}
.tile.bump .v{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.35);color:var(--orange)}}
.cell.heat1{background:color-mix(in srgb,var(--warn) 24%,var(--cell))}
.cell.heat2{background:color-mix(in srgb,var(--bad) 28%,var(--cell))}
.cell.prev{outline:2px dashed var(--orange);outline-offset:-2px}
.pv{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;margin-top:2px}
.pv span{font-size:9.5px;padding:0 4px;border-radius:4px;white-space:nowrap}
.pv .u{background:color-mix(in srgb,var(--good) 16%,var(--cell));color:var(--good)}
.pv .d{background:color-mix(in srgb,var(--bad) 14%,var(--cell));color:var(--bad)}
.btn .sb{display:flex;flex-direction:column;align-items:flex-end}
.theme{font-size:10.5px;border:1px dashed var(--green);border-radius:6px;padding:2px 6px;color:var(--green);line-height:1.35}
.set{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0}

const ownedBy=(o,t)=>CELLS.filter(c=>G.cells[c.i].o===o&&(!t||c.t===t));
const monopoly=(o,pv)=>CELLS.filter(c=>c.pv===pv).every(c=>G.cells[c.i].o===o);
const buildCost=c=>Math.round(c.price*0.5);
function rent(i){
  const c=CELLS[i],s=G.cells[i]; if(s.o<0)return 0; const o=G.players[s.o];
  if(c.t==='public')return 10;
  if(c.t==='transport'){const b=ownedBy(s.o,'transport').length>=2?80:40;return Math.max(10,Math.round(b*Math.min(1.3,Math.max(0.8,G.oil/100))))}
  let m=1;
  switch(c.pv){
    case 2:m=G.food/100;break;
    case 4:m=G.oil/100;break; case 5:m=G.steel/100*(o.comps.some(x=>x.auto)?1.3:1);break;
    case 6:m=1+0.15*o.edu;break; case 7:m=1+0.08*o.culture+0.1*o.pacts.length;break;
    case 8:m=Math.max(0.4,o.support/60)*(o.unrest>=70?0.7:1);break;}
  if(c.pv===8&&G.cells[6].o===s.o)m*=1.15;
  if(c.pv===7&&th('tour'))m*=1.3;
  if(c.pv===3&&has(o,45))m*=1.1;
  if(monopoly(s.o,c.pv))m*=2;
  m*=G.boom==='호황'?1.15:G.boom==='불황'?0.85:1;
  return Math.max(2,Math.round(c.price*0.12*[1,2.6,5,8.5][s.l]*m));
}
function prodOf(p){return (1+0.05*p.edu)*(1-0.004*p.unrest)*Math.max(0.8,1+0.1*(p.pop-3));}
function compProfit(p,co){
  if(co.susp>0)return 0;
  let r=[0,40,80,160][co.tier]*prodOf(p)*(G.boom==='호황'?1.2:G.boom==='불황'?0.8:1),cost=0;
  switch(co.ind){case'제조':cost=10*co.tier*G.steel/100;break;case'IT':r*=1+0.05*p.edu;break;
    case'식품':cost=10*co.tier*G.food/100;break;case'에너지':r*=G.oil/100;break;
    case'관광':r*=1+0.08*p.culture;break;case'사회적':r*=0.5;break;}
  if(co.auto)r*=1.3;
  if(co.ind==='제조'&&p.goods.steel>0)cost/=2;
  if(co.ind==='식품'&&p.goods.food>0)cost/=2;
  if(co.ind==='에너지'&&p.goods.oil>0)r*=1.15;
  if(co.ind==='관광'&&has(p,33))r*=1.2;
  if((co.ind==='제조'||co.ind==='에너지')&&has(p,4))r*=1.15;
  if(p.policy==='industry')r*=1.15;
  if(th('export'))r*=1.25;
  return Math.round(r-cost);
}
function worth(p){
  let w=p.cash-p.loans+p.goods.food*G.food+p.goods.oil*G.oil+p.goods.steel*G.steel;
  ownedBy(p.id).forEach(c=>{w+=c.price+(c.t==='prop'?G.cells[c.i].l*buildCost(c):0);});
  p.comps.forEach(co=>{w+=TIERVAL[co.tier]+(co.auto?150:0);});
  return Math.round(w);
}

function forecast(p){ // 다음 결산 혼란·지지 예상
  const parts=[];let du=2,ds=0;parts.push(['생활 물가 압력',+2,0]);
  if(G.rate>5){du+=2;parts.push(['고금리',+2,0]);}
  const t=TAX[p.tax];if(t.sup||t.un){ds+=t.sup;du+=t.un;parts.push([t.n+' 정책',t.un,t.sup]);}
  const pub=ownedBy(p.id,'public').length;if(pub){du-=pub;parts.push([`공공시설 ${pub}곳`,-pub,0]);}
  if(has(p,8)){du-=1;parts.push(['종합병원',-1,0]);}
  if(has(p,35)){du-=1;parts.push(['도시 숲 공원',-1,0]);}
  if(has(p,46)){ds+=1;parts.push(['노인 복지관',0,1]);}
  const lb=th('labor')?2:1;
  if(p.policy==='welfare'){du-=3;ds+=1;parts.push(['복지 확대 정책',-3,1]);}
  if(p.policy==='industry'){du+=1;parts.push(['산업 진흥 정책',+1,0]);}
  if(p.policy==='culture'){ds+=1;parts.push(['문화 육성 정책',0,1]);}
  const so=p.comps.filter(c=>c.ind==='사회적').length;if(so){const v=2*so*lb,sv=so*lb;du-=v;ds+=sv;parts.push([`사회적 기업 ${so}곳`,-v,sv]);}
  const au=p.comps.filter(c=>c.auto).length;if(au){const v=Math.max(0,au*((p.edu<3?3:1)-(has(p,26)?1:0)))*lb;du+=v;parts.push([`자동화 ${au}곳(교육 ${p.edu})`,v,0]);}
  const e=p.edu;if(e){du-=e;parts.push([`교육 ${p.edu}단계`,-e,0]);}
  const cu=p.culture;if(cu){du-=cu;parts.push([`문화력 ${p.culture}`,-cu,0]);}
  if(p.pop>p.edu+3){du+=2;parts.push(['교육보다 많은 인구',+2,0]);}
  const jobs=jobsOf(p);if(p.pop>jobs){du+=2;parts.push([`일자리 부족(일자리 ${jobs})`,+2,0]);}
  if(p.loans>600){ds-=2;parts.push(['부채 과다',0,-2]);}
  if(p.unrest>60){ds-=2;parts.push(['높은 혼란',0,-2]);}
  if(p.support<40&&p.unrest<50){ds+=1;parts.push(['민심 회복',0,1]);}
  if(p.support>70){ds-=2;parts.push(['높아진 기대',0,-2]);}
  if(p.unrest<15){du+=2;parts.push(['방심·불만 누적',+2,0]);}
  return {du,ds,parts};
}

function runPending(rep){

  due.forEach(x=>{const p=x.pid>=0?G.players[x.pid]:null;if(p&&p.out)return;
    switch(x.k){
      case'strike':if(Math.random()<0.5){const v=30*p.comps.length;p.unrest+=5;p.cash-=v;rep.push(`⛓️ 연쇄 · ${p.name} 파업 장기화 → 혼란 +5${v?`, 기업 손실 −${v}`:''}`);}else rep.push(`⛓️ 연쇄 · ${p.name} 노사 타결 → 피해 없음`);break;
      case'probe':if(Math.random()<0.5){p.support-=4;rep.push(`⛓️ 연쇄 · ${p.name} 특검 수사 → 지지율 −4`);}else{p.support+=3;rep.push(`⛓️ 연쇄 · ${p.name} 무혐의 → 지지율 +3`);}break;
      case'recover':alive().forEach(o=>o.unrest-=3);rep.push('⛓️ 연쇄 · 감염병 회복세 → 모든 지방 혼란 −3');break;
      case'import':mkt('food',-10);rep.push('⛓️ 연쇄 · 식량 긴급 수입 → 식량 −10%');break;

      case'tour':p.cash+=120;rep.push(`⛓️ 연쇄 · ${p.name} 국제 행사 관광 특수 → +120`);break;

function drawCard(p,kind){
  let pg={easy:.6,normal:.5,hard:.4}[G.diff];if(kind==='s'&&th('fake'))pg-=0.15;
  const good=Math.random()<pg;
  const ALL=CARDS.concat(G.opt&&G.opt.labor?CARDS_EXT:[]).filter(c=>c[0]===kind);
  let pool=ALL.map(c=>good?c[1]:c[2]).filter(c=>!G.recent.includes(c.t));
  if(!pool.length)pool=ALL.map(c=>good?c[1]:c[2]);
  const card=pool[Math.floor(Math.random()*pool.length)];
  G.recent.push(card.t);if(G.recent.length>16)G.recent.shift();
  const r=card.fx(p);fixStats();
  return {card,good,r};
}
function fixStats(){G.players.forEach(p=>{p.support=clamp(Math.round(p.support),0,100);p.unrest=clamp(Math.round(p.unrest),0,100);
  p.culture=clamp(p.culture,0,5);p.edu=clamp(p.edu,0,4);p.pop=Math.max(1,p.pop);});}

/* ========= 진행 ========= */
function passStart(p){dex('tax');const t=TAX[p.tax];const v=Math.round(t.inc*taxMul(p));p.cash+=v;log(`${p.name} 국회의사당 통과 → 세수 +${v}(${t.n}${v!==t.inc?', 지지율·테마 반영':''})`);}
async function move(p,n){
  for(let k=0;k<n;k++){p.pos=(p.pos+1)%N;if(p.pos===0)passStart(p);renderBoard();await sleep(p.human?SPD.step:SPD.step*0.6);}
}
async function travelTo(p,t){if(t===p.pos){G.msg='이미 있는 칸입니다. 다른 칸을 고르세요.';render();return;}const n=(t-p.pos+N)%N;G.msg=`🚄 고속철로 ${CELLS[t].name}까지 이동`;await move(p,n);}

async function startTurn(){
  if(G.winner){G.phase='over';render();return;}
  const p=cur();
  if(p.out)return nextTurn();
  if(p.skip>0){p.skip--;G.msg=`${p.name}: 귀농 마을에서 한 턴 쉼`;G.chain='';log(G.msg);render();await sleep(SPD.end);return nextTurn();}
  G.phase=p.hsr?'hsr':'roll';G.choices=null;BEFORE=snap();G.src=null;G.why='';G.advice='';
  if(p.human){G.msg=p.hsr?'🚄 고속철 환승: 보드에서 가고 싶은 칸을 누르거나 주사위를 굴리세요.':'주사위를 굴려 이동하세요.';G.chain='';}
  save();render();
  if(!p.human){await sleep(SPD.ai);await aiTurn(p);}
}
async function aiTurn(p){
  if(p.hsr){p.hsr=false;const t=aiHsrTarget(p);if(t!=null){G.phase='moving';await travelTo(p,t);return afterMove(p);}}
  await doRoll(p);
}
async function doRoll(p){
  p.hsr=false;const d=d12();G.dice.mv=d;setSrc('mv',d);G.phase='moving';G.msg=`${p.name} 이동 주사위 ${d}`;G.chain='';render();
  await move(p,d);await afterMove(p);
}
async function afterMove(p){
  const ch=resolve(p);fixStats();G.players.forEach(ensureCash);
  if(ch&&ch.length&&!p.out){
    if(p.human){G.phase='choice';G.choices=ch;render();fxDiff(p.pos);return;}
    render();fxDiff(p.pos);await TOUR;await sleep(SPD.ai);
    if(aiPick(p,ch)){render();fxDiff(p.pos);return;} // 사람 응답 대기: pick()이 턴을 마무리
    render();fxDiff(p.pos);await TOUR;await sleep(SPD.ai*0.6);return endTurn();
  }
  render();fxDiff(p.pos);await TOUR;await sleep(p.human?SPD.end:SPD.ai);endTurn();
}
function pick(i){
  const p=cur();if(G.phase!=='choice'||!G.choices)return;
  G.src=null;G.advice='';const r=G.choices[i].fn();fixStats();G.players.forEach(ensureCash);
  if(Array.isArray(r)&&r.length){G.choices=r;render();fxDiff(p.pos);return;}
  G.choices=null;G.phase='done';render();fxDiff(p.pos);TOUR.then(()=>setTimeout(endTurn,window.__FAST?0:(fxOn('B')||fxOn('D')?700:400)));
}
function aiPick(p,ch){
  let best=null,bs=-1e9;ch.forEach(c=>{let s=(typeof c.ai==='function'?c.ai():c.ai)??0;if(s>0)s+=Math.random()*2.4-1.2;if(s>bs){bs=s;best=c;}});
  if(!best||bs<=0)best=ch.find(c=>c.pass)||ch[ch.length-1];
  G.src=null;const r=best.fn();fixStats();G.players.forEach(ensureCash);
  if(Array.isArray(r)&&r.length){
    // 사람이 응답해야 하는 선택지(who = 응답자)면 AI가 고르지 않고 사람 입력을 기다린다(true 반환).
    if(r[0].who!=null&&G.players[r[0].who].human){G.phase='choice';G.choices=r;return true;}
    return aiPick(p,r);
  }
  return false;
}
function endTurn(){
  if(G.phase==='over')return;
  checkLastStanding();if(G.winner){G.phase='over';save();render();return;}
  nextTurn();
}

  G.turn++;

  startTurn();

}
function checkLastStanding(){const a=alive();if(a.length===1&&G.players.length>1){G.winner={p:a[0].id,why:'다른 지도자가 모두 파산했습니다.'};log(`🏆 ${a[0].name} 승리(나머지 파산)`,'rd');}}

/* ========= 자금·파산 ========= */
function ensureCash(p){
  if(p.cash>=0||p.out)return;
  const t=[];
  for(const k of['food','oil','steel'])while(p.cash<0&&p.goods[k]>0){p.goods[k]--;p.cash+=G[k];t.push('원자재');}
  while(p.cash<0&&p.comps.length){p.comps.sort((a,b)=>a.tier-b.tier);const co=p.comps.shift();p.cash+=Math.round(TIERVAL[co.tier]/2);t.push(IND[co.ind].ic+'기업');}
  const mine=()=>ownedBy(p.id).sort((a,b)=>(a.price||0)-(b.price||0));
  for(const c of mine()){while(p.cash<0&&G.cells[c.i].l>0){G.cells[c.i].l--;p.cash+=Math.round(buildCost(c)/2);t.push('건물');}}
  for(const c of mine()){if(p.cash>=0)break;G.cells[c.i]={o:-1,l:0};p.cash+=Math.round(c.price/2);t.push(c.sn);}
  if(t.length)log(`${p.name} 현금 부족 → 자산 매각(${[...new Set(t)].join('·')})`);
  if(p.cash<0&&G.opt&&G.opt.bail&&!p.bailed){p.bailed=1;p.cash=300;p.loans=0;dex('debt');log(`🛟 ${p.name} 구제 금융 ₵300 — 빚을 정리하고 다시 시작 (딱 한 번)`);G.msg=`🛟 ${p.name} 구제 금융 ₵300`;}
  if(p.cash<0){p.out=true;p.cash=0;G.cells.forEach(s=>{if(s.o===p.id){s.o=-1;s.l=0;}});
    G.players.forEach(o=>o.pacts=o.pacts.filter(x=>x!==p.id));p.pacts=[];p.comps=[];p.loans=0;
    log(`💥 ${p.name} 파산!`,'rd');G.msg=`💥 ${p.name} 파산`;}
}

      return [C(`${['마을 회관','복합 타운','지역 명소'][s.l]} 건설 ${won(cost)}`,'통행료 크게 상승',()=>{if(p.cash<cost)return;p.cash-=cost;s.l++;say(`${p.name} ${c.name} 건물 ${s.l}단계`,'');},()=>p.cash-cost>(monopoly(p.id,c.pv)?150:280)?8:-1),PASS('다음에')];
    }

    if(c.t==='public'){o.support+=2;dex('public');say(`${c.ic} ${o.name}의 ${c.name} 이용료 ${won(r)}`,`${o.name} 지지율 +2`);}

function policyChoices(p){return Object.entries(POLICY).filter(([k])=>k!==p.policy&&k!=='none').map(([k,v])=>C(`정책: ${v.n}`,v.d,()=>{p.policy=k;if(k==='welfare')dex('welfare');say(`${p.name} 국정 정책 → ${v.n}`,v.d);},()=>aiPolicy(p)===k&&aiPolicy(p)!==p.policy?6:-1));}
function aiPolicy(p){if(p.unrest>45||p.strat==='복지')return'welfare';if(p.strat==='문화')return'culture';if(p.comps.length>=2)return'industry';return'welfare';}
function taxChoices(p,noPass){
  return Object.entries(TAX).filter(([k])=>k!==p.tax).map(([k,t])=>C(`${t.n}으로 바꾸기`,`세수 ${t.inc}${t.sup?` · 지지 ${sg(t.sup)}/R`:' · 지지 변화 없음'}${t.un?` · 혼란 +${t.un}/R`:''}`,()=>{p.tax=k;say(`${p.name} 세금 정책 → ${t.n}`,k==='high'?'세수↑ → 지지율↓ → 선거 위험':k==='low'?'세수↓ → 지지율↑':'');},()=>aiTax(p)===k?5:-1)).concat(noPass?[]:[PASS(`${TAX[p.tax].n} 유지`)]);
}

function aiBuy(p,c){

  if(c.t==='public')return left>200?(p.unrest>35||p.strat==='복지'?9:5):-1;

  const mine=CELLS.filter(x=>x.pv===c.pv&&G.cells[x.i].o===p.id).length;
  const theirs=CELLS.filter(x=>x.pv===c.pv&&G.cells[x.i].o>=0&&G.cells[x.i].o!==p.id).length;
  if(left>120+(G.diff==='hard'?-40:0))return 6+mine*3-(theirs?1:0);

}

      if(bl.length){const c=bl[Math.floor(Math.random()*bl.length)];G.cells[c.i].l--;G.hits.push(c.i);rep.push(`🔥 ${p.name} 혼란 ${p.unrest} → 시위로 ${c.name} 건물 1단계 손실, 지지율 −5`);}

    if(p.unrest>=85){p.pop=Math.max(1,p.pop-1);rep.push(`${p.name} 혼란이 너무 높아 인구 −1`);}
  });

  G.round++;

  pickTheme();

  <h4>협력</h4>상생 협약을 맺으면 서로 통행료 30% 할인, 대신 혼란이 결산마다 10%씩 닮아갑니다. 상대가 사람이면 상대가 수락·거절을 고르며(거절 시 제안자에게 효과 없음), AI 상대는 상대 혼란이 제안자보다 높으면 75%, 아니면 45% 확률로 수락합니다. 평균 혼란이 60을 넘으면 국가 재정 위기가 모두를 덮칩니다.
  <h4>건물</h4>마을 회관 → 복합 타운 → 지역 명소. 단계마다 땅값의 50%. 같은 지방 3곳을 모두 가지면 통행료 2배.
  <h4>국정 정책 (국회의사당)</h4>복지 확대(₵40/R, 혼란 −3, 지지 +1) · 산업 진흥(기업 이익 +15%, 혼란 +1) · 문화 육성(문화 투자 −25%, 지지 +1).
  <h4>더 이어지는 연결</h4><ol class="ol"><li>지지율 70 이상 → 세수 ×1.2, 30 미만 → ×0.8(조세 저항)</li><li>원자재 비축 → 철강은 제조 원가 절반, 식량은 식품 원가 절반·물가 시위 완화, 석유는 에너지 이익 +15%</li><li>문화력 → 결산마다 콘텐츠 수출 ₵15×문화력</li><li>일자리(3 + 기업 단계 합) &lt; 인구 → 혼란 +2, 청년 유출 위험</li><li>광역 순환 버스 → 내 수도권 통행료 +15%</li></ol>
  <h4>다양한 판 흐름</h4>라운드마다 테마 카드 14종 중 하나가 펼쳐지고(최근 5개는 다시 안 나옴), 시민 광장·결산 사회 주사위는 12가지 결과, 45% 확률로 지방 사건 12종, 파업·스캔들·태풍 같은 사건은 다음 라운드에 연쇄 사건을 남깁니다.
  <h4>칸 고유 효과</h4>공공시설 4곳은 보유하면 각자 다른 효과(종합병원 감염병 면제·혼란 감소, 도서관 교육비 할인, 숲공원 혼란 감소, 복지관 지지·선거 유리)를 냅니다. 문화·교육 칸은 처음 투자하면 ✦ 인증이 붙어 칸마다 다른 보너스가 생깁니다. 창업 지원센터에서는 IT·제조 설립비가 ₵50 쌉니다.
  <h4>칸 화살표</h4>칸에 도착하거나 사건이 일어나면 그 칸(결산 때는 경제 주사위)에서 영향을 받은 보드 칸으로 곡선 화살표가 그려지고, 칸마다 바뀐 내용(통행료 +12, 매입, 건물 −1 등)이 뜹니다. 탭이 차례로 열릴 때도 화살표가 보드 칸에서 출발합니다(행동 ← 미리보기 값이 바뀐 칸, 내 지방 ← 사거나 지은 땅, 민심 ← 사건이 난 칸, 순위 ← 통행료가 바뀐 칸). 칸을 누르면 그 칸이 평소 영향을 주는 칸들로 점선 화살표가 그려지고, 칸 정보에 '영향을 주는 칸' 목록이 나옵니다.
  <h4>주사위 출처 표시</h4>주사위로 결과가 정해지면 순서대로 이어집니다. ① 숫자 비행: 주사위 숫자가 결과 줄로 날아감 → ② 색 연결·출처 리본: 주사위와 결과 줄이 같은 색으로 깜빡이고 🎲 리본이 박힘(이동 주황·경제 파랑·사회 보라) → ③ 점선 화살표: 결과 줄에서 바뀐 탭으로 선이 이어지며 숫자가 따라감 → ④ 탭 순회: 행동 → 내 지방 → 민심 → 순위 중 바뀐 탭이 차례로 열리고 바뀐 줄이 깜빡인 뒤 원래 탭으로 돌아옴. 다른 탭에는 배지(지+2, ▲1 등)가 남습니다. 설정에서 하나씩 끌 수 있습니다.
  <h4>시각효과</h4>A 민심 파동: 사건이 칸에서 물결로 퍼지고, 땅은 주인 혼란 50↑ 주황·70↑ 빨강. B 연쇄 카운트: 원인별 숫자가 지표 위로 튀어 오르며 쌓임. C 결과 예고: 선택 버튼에 예상 변화와 영향 칸 점선. D 화살표: 직접 효과는 실선, 파급은 점선.
  <h4>배움 장치 (교육판)</h4>📘 개념 도감 22개: 처음 겪은 경제·사회 개념이 모입니다 · ❔ 해설: 결과의 이유를 접어 둠 · 🧑‍🏫 AI 참모: 선택할 때 힌트 3번 · 🛟 구제 금융: 파산 직전 ₵300을 한 번 받고 다시 시작 · 노동·진로 확장 카드(선택): 재교육·플랫폼 노동·청년 구직 카드 6장.
  <h4>알림</h4><span class="disc">※ 게임의 수치는 설계값입니다. 실제 경제의 정답이 아니라 원인과 결과를 연습하기 위한 모형이에요.</span>`;

function restoreInto(t,s){

  if(Array.isArray(t)&&Array.isArray(s))t.length=s.length;
  for(const k of Object.keys(s)){const sv=s[k],tv=t[k];
    if(sv&&typeof sv==='object'&&tv&&typeof tv==='object'&&Array.isArray(sv)===Array.isArray(tv))restoreInto(tv,sv);else t[k]=sv;}
}

}

    <div class="stats"><div><b>48</b><span>보드 칸</span></div><div><b>9</b><span>지표</span></div><div><b>3</b><span>주사위</span></div><div><b>48</b><span>사건 카드</span></div></div>
  </section>
  <section><div class="sh"><h2>지도자</h2><span>사람 ${humans} · AI ${4-humans} · 한 기기를 돌려 가며</span></div>
    <div class="seats">${SETUP.seats.map((s,i)=>`<div class="st ${s.human?'me':''}" style="--pc:${PCOL[i]}">
      <div class="top"><span class="av">${SYM[i]}</span><input id="nm${i}" value="${s.name}" maxlength="8" aria-label="지도자 ${i+1} 이름"></div>
      <div class="tg" role="group" aria-label="지도자 ${i+1} 조작"><button data-s="${i}" data-h="1" class="${s.human?'on':''}" aria-pressed="${s.human}">사람</button><button data-s="${i}" data-h="0" class="${s.human?'':'on'}" aria-pressed="${!s.human}">AI</button></div>
    </div>`).join('')}</div>
  </section>
  <section><div class="sh"><h2>난이도</h2><span>규칙은 같고 사건 카드 비율만 다릅니다</span></div>
    <div class="diffs">${[['easy','쉬움'],['normal','보통'],['hard','어려움']].map(([k,n])=>`<button class="df ${SETUP.diff===k?'on':''}" data-d="${k}" aria-pressed="${SETUP.diff===k}"><b>${n}</b><span class="ratio"><i style="width:${ratio[k][0]*10}%;background:var(--good)"></i><i style="width:${ratio[k][1]*10}%;background:var(--bad)"></i></span><small>호재 ${ratio[k][0]} : 악재 ${ratio[k][1]}</small></button>`).join('')}</div>
  </section>
  <section><div class="sh"><h2>한 판 길이 · 배움 장치</h2><span>교육판 설정</span></div>
    <div style="background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px 12px">
      <div class="eo"><span class="lab">라운드 수<small>선거는 6라운드마다</small></span><div class="seg">${[12,15,18].map(n=>`<button data-rounds="${n}" class="${SETUP.rounds===n?'on':''}">${n}R</button>`).join('')}</div></div>
      ${[['dex','📘 개념 도감','처음 겪은 개념을 모아요'],['why','❔ 한 줄 해설','결과의 이유를 접어 둠'],['hint','🧑‍🏫 AI 참모','선택 때 힌트 3번'],['bail','🛟 구제 금융','파산 직전 ₵300, 1회'],['labor','👷 노동·진로 카드','재교육·플랫폼 노동·청년 구직 6장']].map(([k,l,s])=>`<div class="eo"><span class="lab">${l}<small>${s}</small></span><div class="seg"><button data-eo="${k}" data-v="1" class="${SETUP.opt[k]?'on':''}">켬</button><button data-eo="${k}" data-v="0" class="${SETUP.opt[k]?'':'on'}">끔</button></div></div>`).join('')}
    </div></section>
  <details class="adv" ${VIEW.advOpen?'open':''}><summary><h2>화면·시각효과</h2><span class="sum">효과 ${fxOnList||'없음'} · ${OPT.speed==='fast'?'빠름':'보통 속도'} · ${frameName}</span><span class="chev">▾</span></summary><div class="body">${settingsHtml()}</div></details>
  <p class="foot">권장 15라운드 · 약 45~60분 · 승리: 순자산 1위 또는 문화 승리<br>※ 게임의 수치는 설계값입니다. 원인과 결과를 연습하기 위한 모형이에요.</p>
  <div class="cta">${saved?`<button class="resume" id="cont">이어하기<small>${saved.round}라운드 저장됨</small></button>`:''}<button class="go" id="start">게임 시작 <small>→</small></button></div>
  </div>`;
  const sync=()=>SETUP.seats.forEach((s,i)=>{const v=$('#nm'+i);if(v)s.name=v.value.trim()||s.name;});
  const adv=el.querySelector('details.adv');adv.ontoggle=()=>{VIEW.advOpen=adv.open;};
  const keep=()=>{const y=el.scrollTop;sync();showSetup();el.scrollTop=y;};
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{SETUP.seats[+b.dataset.s].human=b.dataset.h==='1';keep();});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{SETUP.diff=b.dataset.d;keep();});
  el.querySelectorAll('[data-rounds]').forEach(b=>b.onclick=()=>{SETUP.rounds=+b.dataset.rounds;keep();});
  el.querySelectorAll('[data-eo]').forEach(b=>b.onclick=()=>{SETUP.opt[b.dataset.eo]=+b.dataset.v;keep();});
  wireSettings(el,keep);
  const stopAnim=()=>{if(SU_TIMER){clearInterval(SU_TIMER);SU_TIMER=null;}};
  $('#start').onclick=()=>{stopAnim();sync();newGame(SETUP);el.hidden=true;VIEW={tab:'act',info:null,badge:{}};startTurn();};
  const c=$('#cont');if(c)c.onclick=()=>{stopAnim();G=saved;el.hidden=true;resume();};
  stopAnim();
  if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){let k=0;
    SU_TIMER=setInterval(()=>{if(el.hidden){stopAnim();return;}const a=document.getElementById('mb'+((k+N-1)%N)),b=document.getElementById('mb'+(k%N));if(a)a.classList.remove('on');if(b)b.classList.add('on');k++;},140);}
}
function resume(){clearPawns();G.choices=null;G.hits=[];const p=cur();if(G.phase!=='over'){G.phase=p.hsr?'hsr':'roll';}render();if(!p.human&&G.phase!=='over')startTurn();}

/* ========= 부팅 ========= */
function boot(data){
  applySpeed();LAND=isLand();document.documentElement.classList.toggle('land',LAND);buildBoard();applyFrame();window.addEventListener('resize',()=>{applyOrient();applyFrame();if(G)placePawns();});try{if(window.visualViewport)visualViewport.addEventListener('resize',()=>{applyOrient();applyFrame();if(G)placePawns();})}catch(e){}window.addEventListener('orientationchange',()=>setTimeout(()=>{applyOrient();applyFrame();if(G)placePawns();},250));
  if(data&&data.G&&data.G.v===1&&!data.G.winner){G=data.G;$('#setup').hidden=true;resume();}
  else showSetup();
}
try{window.claude?.hot?.snapshot?.(()=>G?{G:{...G,choices:null}}:{});}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>


<style id="v37board">
/* v37 보드칸: 세이지 녹색 계열(Level 2) — 큰 글자, 굵은 띠, 연한 초록 칸 */
#board{background:#d9e6d6!important;border-color:#bccfb8!important}
.cell{background:#fdfffb!important;border-color:#d5e5d1!important}
.cell .band{height:6px!important}
.cell .nm{font-size:clamp(7px,1.6vw,9.5px)!important;font-weight:800!important;color:#14241a!important;letter-spacing:-.45px!important}
.cell.corner{background:linear-gradient(160deg,#fffdf4,#f9dfba)!important;border-color:#e2711d!important}
.cell.corner .nm{color:#9a470b!important}
.cell.here{box-shadow:0 0 0 2px var(--orange)!important}
.edubadge{font:700 9px var(--f-body);letter-spacing:.06em;color:#fff;background:var(--orange);border-radius:4px;padding:1px 4px;vertical-align:middle}
.why{margin:1px 0 2px;font-size:11px;color:var(--muted)}
.why summary{cursor:pointer;color:var(--green);font-weight:700;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why summary::before{content:"❔ "}
.why p{margin:2px 0 0;padding:4px 7px;background:var(--panel);border-radius:6px;color:var(--ink);line-height:1.4}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px}
.dcard{background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:10.5px;line-height:1.35}
.dcard.got{border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:color-mix(in srgb,var(--green) 9%,var(--cell))}
.dcard.lock{opacity:.65}
.dcard h4{margin:0 0 2px!important;font-size:12.5px!important}
.dcard small{display:block;color:var(--muted)}
.advice{background:color-mix(in srgb,var(--green) 12%,var(--panel));border:1px dashed var(--green);border-radius:8px;padding:4px 7px;margin-top:2px;font-size:11px;line-height:1.4}
.hl{display:flex;flex-direction:column;gap:3px;margin:6px 0;font-size:11px}
.hl div{background:var(--panel);border-radius:6px;padding:3px 6px;line-height:1.4}
.hl .q{background:color-mix(in srgb,var(--orange) 14%,var(--panel));border:1px dashed var(--orange)}
.disc{color:var(--muted);font-size:10.5px;line-height:1.4}
.eo{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:3px 0}
.eo .lab{font-size:12px;flex:1;min-width:0}.eo .lab small{display:block;font-size:10px;color:var(--muted)}
</style>
