<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="./manifest.webmanifest?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="브르마블">
<meta name="theme-color" content="#6040bd">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BlueMarble Tactics · LV5</title>
<style>
:root{
  --bg:#070b17;--bg2:#121a31;--panel:#16203a;--line:#2a3a63;--txt:#e8eefc;--dim:#8ea0c9;
  --acc:#4fd1ff;--acc2:#ffb648;--red:#ff5c7a;--grn:#5ef2a2;--vio:#b58cff;
  --p0:#4fd1ff;--p1:#ff8a5c;--p2:#5ef2a2;--p3:#ffd93d;
  --cell:36px;--gap:2px;--tilt:0deg;--bscale:1;--sidew:220px;
  --zoneN:#1a2748;--zoneE:#3a1c2b;--zoneS:#17303d;--zoneW:#1b3128;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;font-size:13px}
body{background:radial-gradient(900px 500px at 50% -10%,#1a2a55 0%,var(--bg) 60%)}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12px}
button.pri{background:linear-gradient(135deg,#1f6fb5,#4fd1ff);border:none;color:#06101f;font-weight:700}
button.warn{background:linear-gradient(135deg,#a3283f,#ff5c7a);border:none;color:#fff;font-weight:700}
button:disabled{opacity:.35;cursor:default}
.hide{display:none!important}

/* ---------- 시작 화면 ---------- */
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto;z-index:50}
#setup h1{font-size:22px;letter-spacing:3px;color:var(--acc);font-weight:800;text-align:center}
#setup h1 small{display:block;font-size:11px;letter-spacing:6px;color:var(--dim);margin-top:4px}
#setup .sub{color:var(--dim);font-size:12px;text-align:center;max-width:360px;line-height:1.5}
.pcfg{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:28px 1fr 100px 52px;gap:6px;align-items:center}
.prow input{background:#0d1428;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px;font-size:12px;width:100%}
.prow select{background:#0d1428;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px;font-size:11px}
.prow .dot{width:16px;height:16px;border-radius:50%}
.cmdinfo{font-size:11px;color:var(--dim);line-height:1.5;background:#0d1428;border-radius:8px;padding:8px;max-width:380px}
.cmdinfo b{color:var(--txt)}

/* ---------- 상단 ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
#bar{display:flex;align-items:center;gap:6px;padding:3px 8px;flex:none;flex-wrap:nowrap;min-height:0;background:#0b1224;border-bottom:1px solid var(--line)}
#bar #status{flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden;font-size:10px;gap:4px}
#bar .tag{padding:1px 6px}
#bar #title{display:none}
#bar .ctl span{margin-left:6px}
#title{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:var(--dim)}
#title b{color:var(--acc)}
#title .ctl span{margin-left:8px;cursor:pointer;letter-spacing:0;font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
#status{display:flex;gap:6px;font-size:11px;align-items:center;flex-wrap:wrap}
.tag{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.w{border-color:var(--acc2);color:var(--acc2)}
.tag.news{border-color:var(--vio);color:var(--vio)}
#chips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:10px;line-height:1.35;position:relative;overflow:hidden}
.chip.cur{box-shadow:0 0 0 1.5px var(--pc),0 0 14px color-mix(in srgb,var(--pc) 40%,transparent)}
.chip .nm{font-weight:700;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ln{display:flex;justify-content:space-between;color:var(--dim)}
.chip .ln b{color:var(--txt)}
.chip.dead{opacity:.4}
.chip.res::after{content:"레지스탕스";position:absolute;right:-18px;top:6px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:8px;padding:1px 22px}
.chip.flash{animation:chipflash .8s}
@keyframes chipflash{0%,100%{background:var(--panel)}40%{background:#2a3a63}}
.delta{position:absolute;right:6px;top:2px;font-weight:800;font-size:11px;animation:rise 1.4s ease-out forwards;pointer-events:none}
.delta.m{color:var(--red)}.delta.p{color:var(--grn)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- 보드 (2.5D 스테이지) ---------- */
#stage{flex:1;display:flex;align-items:stretch;justify-content:center;padding:2px;min-width:0;min-height:0;position:relative}
#board{position:relative;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(19,minmax(0,1fr));gap:var(--gap);background:#0a0f1d;border-radius:10px;padding:var(--gap);width:100%;height:100%;transform:scale(var(--bscale));transition:transform .4s;box-shadow:0 20px 40px rgba(0,0,0,.6)}
#board.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:scale(var(--bscale)) translate(0,0)}20%{transform:scale(var(--bscale)) translate(-3px,2px)}40%{transform:scale(var(--bscale)) translate(3px,-2px)}60%{transform:scale(var(--bscale)) translate(-2px,-1px)}80%{transform:scale(var(--bscale)) translate(2px,1px)}}
.cell{position:relative;border-radius:5px;background:var(--panel);border:1px solid #223055;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5px;line-height:1.05;text-align:center;cursor:pointer;user-select:none;box-shadow:0 2px 0 #050810,0 4px 6px rgba(0,0,0,.5)}
.cell .ic{font-size:11px;line-height:1}
.cell .nm{color:#c5d2f2;padding:0 1px;letter-spacing:-.3px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.cell.zN{background:var(--zoneN)}.cell.zE{background:var(--zoneE)}.cell.zS{background:var(--zoneS)}.cell.zW{background:var(--zoneW)}
.cell.corner{background:linear-gradient(135deg,#2a3a63,#15203c);border-color:var(--acc)}
.cell.node{border-color:var(--acc2)}
.cell.event{border-style:dashed;border-color:var(--vio)}
.cell.owned{box-shadow:inset 0 0 0 2px var(--pc),0 2px 0 var(--pc),0 4px 6px rgba(0,0,0,.5)}
.cell .df{position:absolute;right:1px;top:1px;font-size:7px;letter-spacing:-1px}
.cell .emp{position:absolute;inset:0;border-radius:5px;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(181,140,255,.3) 3px 5px);pointer-events:none;animation:flick .4s steps(2) infinite}
@keyframes flick{to{opacity:.4}}
.cell.inrange{outline:1.5px solid var(--acc);outline-offset:-1px;animation:holo 1.2s ease-in-out infinite}
.cell.inrange::before{content:attr(data-d);position:absolute;right:2px;bottom:1px;font-size:7px;color:var(--acc)}
.cell.target{outline:2px solid var(--red);animation:holo .6s ease-in-out infinite}
.cell.hit{animation:hit .5s ease-out}
.cell.guer{box-shadow:inset 0 0 0 2px var(--red),0 2px 0 var(--red)}
@keyframes holo{0%,100%{box-shadow:0 2px 0 #050810,0 0 0 0 rgba(79,209,255,0)}50%{box-shadow:0 2px 0 #050810,0 0 10px 2px rgba(79,209,255,.5)}}
@keyframes hit{0%{background:#ff5c7a;transform:scale(1.15)}100%{transform:scale(1)}}
/* 건물 타워(세워진 블록) */
.bld{position:absolute;left:2px;bottom:2px;display:flex;gap:1px;align-items:flex-end;transform-origin:bottom;pointer-events:none}
.bld i{width:4px;background:linear-gradient(180deg,#fff8,var(--pc) 40%,color-mix(in srgb,var(--pc) 50%,#000));border-radius:1px 1px 0 0;box-shadow:1px 1px 0 #0008}
/* 실드 돔 */
.dome{position:absolute;inset:-1px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(79,209,255,.35),rgba(79,209,255,.05) 60%,transparent 70%);border:1px solid rgba(79,209,255,.5);pointer-events:none;animation:domeb 2.4s ease-in-out infinite}
.dome.flash{animation:domef .7s}
@keyframes domeb{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes domef{0%{background:#4fd1ffcc;transform:scale(1.1)}100%{transform:scale(1)}}
/* 말(세워진 핀) */
.tok{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px;}
.tok i{display:block;width:9px;height:9px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 45%,color-mix(in srgb,var(--pc) 55%,#000));transform:rotate(-45deg);transform-origin:bottom left;box-shadow:0 0 6px var(--pc);animation:bob 1.6s ease-in-out infinite}
.tok i.cur{width:11px;height:11px;animation:bob .9s ease-in-out infinite}
.tok i.g{border-radius:2px;background:var(--red);animation:none}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2px}}

/* ---------- 콘솔 ---------- */
#bottom{flex:none;display:flex;flex-direction:column;min-height:0}
#bottom #chips{padding:4px;order:0;background:#0b1224}
#console{order:1;flex:0 0 25vh;min-height:190px;margin:0 4px 4px;background:#0e1529f2;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;position:relative;z-index:1}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:none;border-radius:0;background:transparent;color:var(--dim);padding:6px 0;font-size:11px;position:relative}
#tabs button.on{color:var(--acc)}
#tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:2px;background:var(--acc)}
#panes{flex:1;overflow:auto;padding:6px;font-size:11px;line-height:1.45;min-height:0}
.pane{display:none}.pane.on{display:block}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.btns button{flex:1 1 45%}
#dice{display:flex;gap:6px;align-items:center;margin:4px 0}
.die{width:30px;height:30px;border-radius:7px;background:#fff;color:#06101f;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #9aa,0 5px 8px #0008}
.die.roll{animation:spin .5s linear}
@keyframes spin{to{transform:rotate(360deg)}}
#log{font-size:10px;color:var(--dim);border-top:1px dashed var(--line);margin-top:6px;padding-top:4px;max-height:38%;overflow:auto}
#log div{padding:1px 0}
#log .c0{color:var(--p0)}#log .c1{color:var(--p1)}#log .c2{color:var(--p2)}#log .c3{color:var(--p3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;margin:4px 0}
.card h4{font-size:11px;color:var(--acc);margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:10px}
.kv span:nth-child(odd){color:var(--dim)}
.cmp{width:100%;border-collapse:collapse;font-size:10px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:2px 3px;text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.q{border-left:3px solid var(--acc2);padding-left:6px;margin:4px 0}
.rule h5{color:var(--acc2);margin:6px 0 2px;font-size:11px}
.rule p{color:#c5d2f2;margin-bottom:3px}
.hint{color:var(--acc);font-size:10px}
.chain{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:3px 0}
.chain span{background:#0d1428;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10px;animation:chipin .35s both}
.chain span.bad{border-color:var(--red)}.chain span.good{border-color:var(--grn)}
.chain em{color:var(--acc2);font-style:normal;animation:chipin .35s both}
@keyframes chipin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.newsbar{background:linear-gradient(90deg,#2a1d4f,#16203a);border:1px solid var(--vio);border-radius:8px;padding:5px 7px;font-size:10px;margin:4px 0;animation:chipin .5s}
.newsbar b{color:var(--vio)}

/* ---------- 바다 / 함대 / 위성 ---------- */
#sea{grid-column:2/11;grid-row:2/19;position:relative;margin:1px;border-radius:9px;overflow:hidden;z-index:0;
  background:
   radial-gradient(ellipse at 50% 50%,#0f3b5c 0%,#0b2a46 55%,#08203a 100%);
  box-shadow:inset 0 0 0 3px #223a2a,inset 0 0 14px 8px #1b3326}
#sea::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(120,200,255,.07) 14px 16px);animation:wave 7s linear infinite;pointer-events:none}
#sea::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,transparent 0 22px,rgba(120,200,255,.05) 22px 25px);animation:wave 11s linear infinite reverse;pointer-events:none}
@keyframes wave{to{background-position:60px 40px}}
#seaband{position:absolute;left:0;top:0;width:100%;padding:3px 4px;z-index:3;overflow:hidden}
#satlane{position:relative;height:14px;flex:none;border-bottom:1px dashed rgba(120,200,255,.25)}
.sat{position:absolute;top:0;font-size:9px;line-height:14px;white-space:nowrap;color:var(--pc);text-shadow:0 0 4px var(--pc);animation:orbit var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes orbit{from{left:-14%}to{left:102%}}
#isles{display:flex;gap:3px;flex-wrap:wrap;flex:none}
.isle{display:inline-flex;align-items:center;gap:2px;font-size:9px;padding:1px 5px;border-radius:999px;background:#2b3a2acc;border:1px solid var(--pc,#5a7a4a);color:#dfe;white-space:nowrap}
#fleet{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;flex:1;min-height:0;overflow:hidden}
.ship{display:inline-flex;align-items:center;gap:2px;font-size:9px;padding:1px 5px;border-radius:999px;background:#0b1f36cc;border:1px solid var(--pc);color:#dfe;white-space:nowrap;animation:bob 2.2s ease-in-out infinite;cursor:pointer}
.ship.sub{border-style:dashed;opacity:.75}
.ship.hitf{animation:hit .5s}
.ship b{display:inline-flex;gap:1px}.ship b i{width:4px;height:6px;background:var(--grn);border-radius:1px}.ship b i.x{background:#334}
.seahint{display:none}
#seamap{position:absolute;inset:0;z-index:1;pointer-events:none}
#seamap>*{pointer-events:auto}
.ship{position:absolute;width:20px;height:22px;margin:-11px 0 0 -10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;line-height:1;background:none;border:none;border-radius:0;padding:0;white-space:nowrap;cursor:pointer;z-index:2;filter:drop-shadow(0 0 3px var(--pc)) drop-shadow(0 2px 2px #000c);animation:bob 2.2s ease-in-out infinite}
.ship.sub{opacity:.55;filter:drop-shadow(0 0 4px #4fd1ff)}
.ship b{display:flex;gap:1px}
.ship b i{width:4px;height:3px;border-radius:1px;background:var(--grn)}
.ship b i.x{background:#334}
.isle{position:absolute;width:46px;height:40px;margin:-20px 0 0 -23px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-size:18px;line-height:1;background:none;border:none;padding:0;color:inherit;cursor:pointer;z-index:2}
.mbase{position:absolute;left:1px;top:0;font-size:9px;pointer-events:none;z-index:2}
.isle small{font-size:8px;line-height:1.2;color:#eafff0;background:#0b1f36d9;border:1px solid var(--pc);border-radius:999px;padding:0 4px;white-space:nowrap;margin-top:2px}
.plane{position:absolute;font-size:14px;z-index:7;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.6))}
.para{position:absolute;font-size:12px;z-index:7;pointer-events:none;animation:para 1.3s ease-in forwards}
@keyframes para{0%{transform:translate(-50%,-40px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.laser{position:absolute;height:3px;background:linear-gradient(90deg,#fff,#ff5c7a,#fff);transform-origin:left center;z-index:7;pointer-events:none;box-shadow:0 0 8px #ff5c7a,0 0 16px #ff5c7a;animation:laser .45s ease-out forwards}
@keyframes laser{0%{opacity:0;transform:rotate(var(--ang)) scaleX(0)}10%{opacity:1;transform:rotate(var(--ang)) scaleX(1)}80%{opacity:1}100%{opacity:0;transform:rotate(var(--ang)) scaleX(1)}}
.bullet{position:absolute;width:6px;height:2px;background:#ffe9a8;box-shadow:0 0 4px #ffb648;transform-origin:left center;z-index:7;pointer-events:none;animation:bullet .22s linear forwards}
@keyframes bullet{from{transform:rotate(var(--ang)) translateX(0)}to{transform:rotate(var(--ang)) translateX(var(--len))}}
.icbm{position:absolute;width:10px;height:26px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#fff,#aab);box-shadow:0 0 8px #fff;z-index:8;pointer-events:none}
.icbm::after{content:"";position:absolute;left:1px;bottom:-14px;width:8px;height:14px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#ff5c7a,#ffb648,transparent);filter:blur(1px)}
.grenade{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9c9,#263);box-shadow:0 0 3px #000;z-index:7;pointer-events:none}
.splash{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #9fe;z-index:6;pointer-events:none;animation:ring .8s ease-out forwards}
.dicefn{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:10px;margin:4px 0;background:#0d1428;border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.dicefn span:nth-child(odd){color:var(--acc2)}
/* ---------- 이펙트 ---------- */
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2;}
#fxlayer{position:absolute;inset:0;pointer-events:none;z-index:9}
#fx path{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:5 4;animation:dash .6s linear infinite;filter:drop-shadow(0 0 4px var(--red))}
#fx path.emp{stroke:var(--vio)}#fx path.ok{stroke:var(--grn)}
@keyframes dash{to{stroke-dashoffset:-18}}
#fxtop{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:visible}
#fxtop path{fill:none;stroke:var(--acc2);stroke-width:1.5;stroke-dasharray:4 4;animation:dash .5s linear infinite;filter:drop-shadow(0 0 3px var(--acc2))}
.missile{position:absolute;left:0;top:0;width:14px;height:6px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,#999,#fff);box-shadow:0 0 6px #fff;z-index:5;pointer-events:none;transform-origin:center}
.missile::before{content:"";position:absolute;left:-9px;top:1px;width:9px;height:4px;border-radius:4px 0 0 4px;background:linear-gradient(90deg,transparent,#ffb648,#ff5c7a);filter:blur(.5px)}
.missile.emp{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,var(--vio));box-shadow:0 0 10px var(--vio)}
.missile.emp::before{display:none}
.mshadow{position:absolute;width:10px;height:4px;border-radius:50%;background:#0009;z-index:3;pointer-events:none}
.trail{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd48a;box-shadow:0 0 5px #ffb648;z-index:4;pointer-events:none;animation:trailf .5s ease-out forwards}
.trail.v{background:#d9c6ff;box-shadow:0 0 5px var(--vio)}
@keyframes trailf{to{opacity:0;transform:scale(.2)}}
.boom{position:absolute;width:10px;height:10px;border-radius:50%;z-index:6;pointer-events:none;background:radial-gradient(circle,#fff 0%,#ffd48a 30%,#ff5c7a 60%,transparent 70%);animation:boom .6s ease-out forwards}
.boom.big{animation:boomBig .9s ease-out forwards}
.boom.blue{background:radial-gradient(circle,#fff,#4fd1ff 50%,transparent 70%)}
.boom.vio{background:radial-gradient(circle,#fff,var(--vio) 50%,transparent 70%)}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
@keyframes boomBig{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(9);opacity:0}}
.ring{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--vio);z-index:6;pointer-events:none;animation:ring 1s ease-out forwards}
.ring.r{border-color:var(--red)}.ring.b{border-color:var(--acc)}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}

.toast{position:absolute;z-index:8;background:#06101f;border:1px solid var(--acc);color:var(--txt);font-size:10px;padding:3px 6px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);animation:pop 1.8s ease-out forwards;pointer-events:none}
.toast.bad{border-color:var(--red)}.toast.good{border-color:var(--grn)}

class Deck{constructor(items){this.items=items;this.pile=[];this.last=null}
  draw(){if(!this.pile.length){this.pile=shuffle(this.items);if(this.pile.length>1&&this.pile[this.pile.length-1]===this.last){this.pile.unshift(this.pile.pop())}}const x=this.pile.pop();this.last=x;return x}
  peek(n){while(this.pile.length<n){this.pile=shuffle(this.items).concat(this.pile)}return this.pile.slice(-n).reverse()}}

function diceBag(p){if(!p.bag||!p.bag.length){p.bag=shuffle([...Array(36)].map((_,i)=>[1+(i%6),1+Math.floor(i/6)]))}
  let d=p.bag.pop();if(p.bag.length&&d[0]+d[1]===p.lastTotal){const alt=p.bag.pop();p.bag.push(d);d=alt}p.lastTotal=d[0]+d[1];return d}

function seaDims(){return isLand()?[17,9]:[9,17]} // 바다 안쪽 칸 수 [가로, 세로]
// 정박지(모퉁이 밖 칸) → 바다 쪽 해안 좌표. 같은 칸에 여러 척이면 해안을 따라 펼침
function seaSpot(a,k,n){const land=isLand(),R=land?10:18,C=land?18:10,[SC,SR]=seaDims(),{r,c}=rc(a);
  let u=c===0?0:c===C?SC-1:Math.min(SC-1,Math.max(0,c-1)), v=r===0?0:r===R?SR-1:Math.min(SR-1,Math.max(0,r-1));
  const t=(k-(n-1)/2)*1.3;
  if(r===0){v+=1;u+=t}else if(r===R){v-=1;u+=t}else if(c===0){u+=1;v+=t}else{u-=1;v+=t}
  return [Math.min(SC-1,Math.max(0,u)),Math.min(SR-1,Math.max(0,v))]}
function seaShips(){
  const all=[];P.forEach(p=>p.fleet.forEach(s=>all.push({s,p})));
  const cnt={},seen={};all.forEach(({s})=>{cnt[s.anchor]=(cnt[s.anchor]||0)+1});
  const [SC,SR]=seaDims();
  return all.map(({s,p})=>{const k=seen[s.anchor]||0;seen[s.anchor]=k+1;const [u,v]=seaSpot(s.anchor,k,cnt[s.anchor]);
    const pips=[...Array(UNITS[s.t].hp)].map((_,j)=>`<i class="${j<s.hp?'':'x'}"></i>`).join('');
    return `<span class="ship ${s.t==='sub'?'sub':''}" id="ship${s.id}" title="${p.name} ${UNITS[s.t].n} · 정박 ${cell(s.anchor).name}" style="--pc:${p.color};left:${(u+.5)/SC*100}%;top:${(v+.5)/SR*100}%" onclick="shipInfo(${s.id})">${UNITS[s.t].ic}<b>${pips}</b></span>`}).join('')}

function fly(from,to,type,opt,done){
  if(window.FAST){done&&done();return}
  const [x1,y1]=opt.from||cxy(from),[x2,y2]=opt.to||cxy(to),[mx,my]=bcenter();
  const cxp=(x1+x2)/2*0.4+mx*0.6, cyp=(y1+y2)/2*0.4+my*0.6; // 제어점: 보드 중앙 쪽으로

    if(stopped)return;

    const u=1-t,gx=u*u*x1+2*u*t*cxp+t*t*x2,gy=u*u*y1+2*u*t*cyp+t*t*y2;
    const alt=Math.sin(Math.PI*t)*H;

/* ---------- 주사위 결정 공격 ---------- */
function tgName(t){if(!t)return '-';if(t.kind==='cell')return cell(t.i).ic+' '+cell(t.i).short;if(t.kind==='guer')return '💀 게릴라';return UNITS[t.ship.t].ic+' '+P[t.owner].name+'의 '+UNITS[t.ship.t].n}
function hasU(p,t){return p.fleet.some(s=>s.t===t&&s.hp>0)}
function anchorD(p,t,i){const ss=p.fleet.filter(s=>s.t===t&&s.hp>0);if(!ss.length)return 99;return Math.min(...ss.map(s=>dist(s.anchor,i)))}
function tgIdx(t){return t.kind==='cell'?t.i:t.kind==='guer'?guer:t.ship.anchor}
const RADAR_SLOTS=[1,2], BASE_COST=1200, RADAR_COST=500, SIDE_NAME={N:'북',E:'동',S:'남',W:'서'};
// 보드를 4면으로: N(0~10, 11칸) · E(11~27) · S(28~38, 11칸) · W(39~55)
function sideOf(i){return i<=10?'N':i<=27?'E':i<=38?'S':'W'}
const baseAt=c=>c.mb!=null&&c.mb===c.owner; // 미사일기지: 건설자가 여전히 소유한 도시에만 유효
function baseOn(p,side){return cells.some(c=>baseAt(c)&&c.owner===p.id&&sideOf(c.i)===side)}
function sideHasBase(side){return cells.some(c=>baseAt(c)&&sideOf(c.i)===side)}
function radarOK(p){return ISLES.some((s,k)=>RADAR_SLOTS.includes(k)&&s.owner===p.id&&s.radar===true)}
function crossSea(p,t){const a=sideOf(p.pos),b=sideOf(t);return (a==='N'&&b==='S')||(a==='S'&&b==='N')}
function baseBtns(p){
  const cands=cells.filter(c=>c.owner===p.id&&(c.type==='city'||c.type==='node')&&!baseAt(c)&&!sideHasBase(sideOf(c.i)));
  if(!cands.length)return '<p class="hint">🚀 미사일기지: 각 면에 1개 · 내 도시가 있고 빈 면이어야 건설 가능</p>';
  return `<p class="hint">🚀 미사일기지 (₲${BASE_COST}) — 각 면에 1개, 도시 소유가 바뀌면 소멸</p>`+cands.map(c=>`<button ${p.gold<BASE_COST?'disabled':''} onclick="buildBase(${c.i})">🚀 ${SIDE_NAME[sideOf(c.i)]}면 · ${c.name}</button>`).join('');
}
function buildBase(i){const p=P[cur],c=cell(i);if(p.gold<BASE_COST||c.owner!==p.id||baseAt(c)||sideHasBase(sideOf(i)))return;
  p.gold-=BASE_COST;c.mb=p.id;sfx.coin();log(`${p.name} ${SIDE_NAME[sideOf(i)]}면 미사일기지 건설 (${c.name}) ₲${BASE_COST}`,p.id);
  banner('🚀 미사일기지 건설',`${SIDE_NAME[sideOf(i)]}면 · ${c.name}`);chipDelta(p.id,'−'+fmt(BASE_COST),'m');attackOpts=null;closeModal();updateBoard();renderAct()}
function buildRadar(k){const p=P[cur],isl=ISLES[k];if(isl.owner!==p.id||isl.radar||p.gold<RADAR_COST)return;
  p.gold-=RADAR_COST;isl.radar=true;sfx.coin();log(`${p.name} ${isl.n} 레이더기지 건설 ₲${RADAR_COST}`,p.id);
  banner('📡 레이더기지 가동',`${isl.n} · 바다 건너 다양한 무기 사용 가능`);chipDelta(p.id,'−'+fmt(RADAR_COST),'m');attackOpts=null;closeModal();updateBoard();renderAct()}
function genOptions(p){
  const truce=news&&news.k==='truce';
  let targets=[];
  if(!truce){
    cells.forEach(c=>{if(c.owner!==null&&c.owner!==p.id&&canTarget(p,c))targets.push({kind:'cell',i:c.i})});
    if(guer>=0&&dist(p.pos,guer)<=range)targets.push({kind:'guer'});
    P.forEach(o=>{if(o.id===p.id||!o.alive||o.immune>0)return;o.fleet.forEach(s=>{if(s.hp<=0)return;if(s.t==='sub'&&!hasU(p,'destroyer'))return;if(dist(p.pos,s.anchor)<=range)targets.push({kind:'ship',ship:s,owner:o.id})})});
  }
  targets.sort((a,b)=>((tgIdx(a)-p.pos+N)%N)-((tgIdx(b)-p.pos+N)%N));
  const tIdx=targets.length?(dice[1]-1)%targets.length:0,target=targets[tIdx]||null;
  const base=['bullet','shell','missile','drone','laser','icbm'][dice[0]-1];
  const options=[];let fallback='';
  const d=target?dist(p.pos,tgIdx(target)):99;
  const isShip=target&&target.kind==='ship',isSub=isShip&&target.ship.t==='sub';
  const cr=!!(target&&crossSea(p,tgIdx(target))),rd=radarOK(p),longOK=p.sats.M>0||hasU(p,'carrier')||cell(36).owner===p.id||baseOn(p,sideOf(p.pos))||rd,far=cr,nonMissOK=!cr||rd;
  const can={
    bullet:()=>!isShip&&d<=2&&nonMissOK, grenade:()=>!isShip&&d<=3&&nonMissOK,
    shell:()=>hasU(p,'destroyer')&&(anchorD(p,'destroyer',tgIdx(target))<=5||rd&&far)&&!isSub&&nonMissOK,
    missile:()=>!isSub&&(!far||longOK), drone:()=>hasU(p,'carrier')&&(anchorD(p,'carrier',tgIdx(target))<=8||rd&&far)&&!isSub&&nonMissOK,
    bomber:()=>hasU(p,'carrier')&&(anchorD(p,'carrier',tgIdx(target))<=12||rd&&far)&&!isSub&&nonMissOK,
    laser:()=>p.sats.M>0&&!isSub, icbm:()=>p.sats.M>0&&!isSub,
    emp:()=>!isShip&&target&&target.kind==='cell'&&weather.k!=='solar'&&(!far||longOK), strike:()=>!isShip&&target&&target.kind==='cell'&&nonMissOK,
    para:()=>hasU(p,'carrier')&&target&&target.kind==='cell'&&dice[0]===dice[1],
    torpedo:()=>isShip&&!isSub&&hasU(p,'sub'), depth:()=>isSub&&hasU(p,'destroyer'),
  };
  const chainMap={bullet:['grenade','missile'],shell:['grenade','missile'],drone:['missile'],laser:['emp','missile'],icbm:['bomber','strike','missile']};
  let w=base;
  if(target){
    if(isSub){w='depth';fallback='잠수함은 폭뢰로만'}
    else if(!can[w]()){const ch=chainMap[w]||['missile'];const f=ch.find(x=>can[x]());if(f){fallback=`${WPN[w].n} 불가 → ${WPN[f].n}`;w=f}else{w=null;fallback=far&&!longOK?'🌊 11면→11면 장거리 — 군사위성·항모·핵융합·미사일기지·레이더섬 필요':far?'🌊 바다 건너 — 레이더섬 필요':'쓸 수 있는 무기 없음'}}
    if(w){const cost=w==='emp'?3-(p.cmd==='P'?1:0):WPN[w].ap;options.push({w,cost,ok:true,note:WPN[w].d})}
    if(isShip&&!isSub&&can.torpedo()&&w!=='torpedo')options.push({w:'torpedo',cost:2,ok:true,alt:true,note:WPN.torpedo.d});
    if(dice[0]===dice[1]&&can.para()){const c=cell(target.i);options.push({w:'para',cost:3,ok:true,alt:true,note:c.lvl===0&&!c.def.shield&&!c.def.ciws?'무방비 도시 — 점령 가능!':'방비 중 — 격퇴될 수 있음'})}
    if(!isShip&&target.kind==='cell'&&w!=='emp'&&can.emp())options.push({w:'emp',cost:3-(p.cmd==='P'?1:0),ok:true,alt:true,note:WPN.emp.d});

function botTurn(){const p=P[cur];if(!p.alive||phase!=='roll')return;roll()}
function botAttack(){
  const p=P[cur],m=defCostMul(p,1);
  const need=cities(p).filter(c=>!c.def.shield).sort((a,b)=>b.price*(1+b.lvl)-a.price*(1+a.lvl))[0];
  if(need&&p.gold>Math.round(100*m)+500){p.gold-=Math.round(100*m);need.def.shield=1;log(`${p.name} ${need.name}에 실드 설치`,p.id);toast(need.i,'🛡 설치','good')}
  const upg=cities(p).filter(c=>c.type==='city'&&c.lvl<3&&c.zone==='E')[0];
  if(upg&&p.gold>upg.price*.5+700){p.gold-=Math.round(upg.price*.5);upg.lvl++;log(`${p.name} ${upg.name} 증축`,p.id)}
  if(p.resist&&p.bomb>0){const t=cells.find(c=>c.owner===null&&(c.type==='node'||c.type==='corner'))||cells.find(c=>c.owner===null&&c.price>0);if(t){p.bomb--;STATS.bomb++;t.owner=p.id;log(`💣 ${p.name} 기습 점령 → ${t.name}`,p.id);toast(t.i,'기습 점령','bad')}}
  if(p.orbital>0){const t=cells.filter(c=>c.owner!==null&&c.owner!==p.id).sort((a,b)=>b.lvl-a.lvl)[0];if(t){p.orbital--;STATS.orbital++;orbitalStrike(t.i,'궤도 타격');log(`${p.name} 궤도 타격 → ${t.name}`,p.id)}}
  const truce=news&&news.k==='truce';
  // 군비
  if(p.gold>1500&&!hasU(p,'destroyer'))buyUnit('destroyer');else if(p.gold>1800&&!hasU(p,'carrier'))buyUnit('carrier');else if(p.gold>1500&&!p.sats.M)buyUnit('satM');else if(p.gold>1500&&!p.sats.C)buyUnit('satC');else if(p.gold>2000&&!hasU(p,'sub'))buyUnit('sub');
  if(p.cd===0&&p.ap>=CMDS[p.cmd].ap){
    if(p.cmd==='A'&&cities(p).length>=3&&cells.some(c=>c.owner!==null&&c.owner!==p.id&&dist(p.pos,c.i)<=8)&&p.ap>=6)useSkill();
    else if(p.cmd==='P'&&leader(p)&&leader(p).ap>=4)useSkill();
    else if(!truce&&p.cmd==='V'&&cells.filter(c=>c.owner!==null&&c.owner!==p.id&&c.lvl>0&&dist(p.pos,c.i)<=range).length>=2)useSkill();
  }
  attackOpts=genOptions(p);const ao=attackOpts;
  if(!attacked){
    const isleOpt=ao.options.find(x=>x.isle!==undefined);
    const cityPara=ao.target&&ao.target.kind==='cell'?ao.options.find(x=>x.w==='para'&&x.isle===undefined&&cell(ao.target.i).lvl===0&&!cell(ao.target.i).def.shield&&!cell(ao.target.i).def.ciws):null;
    const main=ao.options.find(x=>x.isle===undefined&&x.w!=='para'&&x.ok&&p.ap>=x.cost);
    if(cityPara&&p.ap>=3){fire(p,ao.target,'para');return}
    if(isleOpt&&p.ap>=3){fireIsle(p,isleOpt.isle);return}
    if(main&&ao.target&&(main.w!=='icbm'||p.ap>=8)){fire(p,ao.target,main.w);return}}
  updateBoard();setTimeout(endTurn,T(600));
}
