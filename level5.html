<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BlueMarble Tactics · LV5</title>
<style>
:root{
  --bg:#070b17;--bg2:#121a31;--panel:#16203a;--line:#2a3a63;--txt:#e8eefc;--dim:#8ea0c9;
  --acc:#4fd1ff;--acc2:#ffb648;--red:#ff5c7a;--grn:#5ef2a2;--vio:#b58cff;
  --p0:#4fd1ff;--p1:#ff8a5c;--p2:#5ef2a2;--p3:#ffd93d;
  --cell:36px;--gap:2px;--tilt:0deg;--bscale:1;--sidew:220px;
  --zoneN:#1a2748;--zoneE:#3a1c2b;--zoneS:#17303d;--zoneW:#1b3128;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;font-size:13px}
body{background:radial-gradient(900px 500px at 50% -10%,#1a2a55 0%,var(--bg) 60%)}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12px}
button.pri{background:linear-gradient(135deg,#1f6fb5,#4fd1ff);border:none;color:#06101f;font-weight:700}
button.warn{background:linear-gradient(135deg,#a3283f,#ff5c7a);border:none;color:#fff;font-weight:700}
button:disabled{opacity:.35;cursor:default}
.hide{display:none!important}

/* ---------- 시작 화면 ---------- */
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:auto;z-index:50}
#setup h1{font-size:22px;letter-spacing:3px;color:var(--acc);font-weight:800;text-align:center}
#setup h1 small{display:block;font-size:11px;letter-spacing:6px;color:var(--dim);margin-top:4px}
#setup .sub{color:var(--dim);font-size:12px;text-align:center;max-width:360px;line-height:1.5}
.pcfg{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:28px 1fr 100px 52px;gap:6px;align-items:center}
.prow input{background:#0d1428;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px;font-size:12px;width:100%}
.prow select{background:#0d1428;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px;font-size:11px}
.prow .dot{width:16px;height:16px;border-radius:50%}
.cmdinfo{font-size:11px;color:var(--dim);line-height:1.5;background:#0d1428;border-radius:8px;padding:8px;max-width:380px}
.cmdinfo b{color:var(--txt)}

/* ---------- 상단 ---------- */
#app{height:100dvh;height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
#top{padding:6px 8px 4px;display:flex;flex-direction:column;gap:4px;flex:none}
#title{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:var(--dim)}
#title b{color:var(--acc)}
#title .ctl span{margin-left:8px;cursor:pointer;letter-spacing:0;font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
#status{display:flex;gap:6px;font-size:11px;align-items:center;flex-wrap:wrap}
.tag{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.w{border-color:var(--acc2);color:var(--acc2)}
.tag.news{border-color:var(--vio);color:var(--vio)}
#chips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:10px;line-height:1.35;position:relative;overflow:hidden}
.chip.cur{box-shadow:0 0 0 1.5px var(--pc),0 0 14px color-mix(in srgb,var(--pc) 40%,transparent)}
.chip .nm{font-weight:700;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ln{display:flex;justify-content:space-between;color:var(--dim)}
.chip .ln b{color:var(--txt)}
.chip.dead{opacity:.4}
.chip.res::after{content:"레지스탕스";position:absolute;right:-18px;top:6px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:8px;padding:1px 22px}
.chip.flash{animation:chipflash .8s}
@keyframes chipflash{0%,100%{background:var(--panel)}40%{background:#2a3a63}}
.delta{position:absolute;right:6px;top:2px;font-weight:800;font-size:11px;animation:rise 1.4s ease-out forwards;pointer-events:none}
.delta.m{color:var(--red)}.delta.p{color:var(--grn)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- 보드 (2.5D 스테이지) ---------- */
#stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:2px 0 4px;perspective:1500px;perspective-origin:50% 50%;min-height:0;position:relative}
#board{position:relative;display:grid;grid-template-columns:repeat(11,var(--cell));grid-template-rows:repeat(19,var(--cell));gap:var(--gap);background:#0a0f1d;border-radius:10px;padding:var(--gap);transform:rotateX(var(--tilt)) scale(var(--bscale));transform-style:preserve-3d;transition:transform .4s;box-shadow:0 20px 40px rgba(0,0,0,.6)}
#board.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:rotateX(var(--tilt)) scale(var(--bscale)) translate(0,0)}20%{transform:rotateX(var(--tilt)) scale(var(--bscale)) translate(-3px,2px)}40%{transform:rotateX(var(--tilt)) scale(var(--bscale)) translate(3px,-2px)}60%{transform:rotateX(var(--tilt)) scale(var(--bscale)) translate(-2px,-1px)}80%{transform:rotateX(var(--tilt)) scale(var(--bscale)) translate(2px,1px)}}
.cell{position:relative;border-radius:5px;background:var(--panel);border:1px solid #223055;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5px;line-height:1.05;text-align:center;cursor:pointer;user-select:none;transform-style:preserve-3d;box-shadow:0 2px 0 #050810,0 4px 6px rgba(0,0,0,.5)}
.cell .ic{font-size:11px;line-height:1}
.cell .nm{color:#c5d2f2;padding:0 1px;letter-spacing:-.3px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.cell.zN{background:var(--zoneN)}.cell.zE{background:var(--zoneE)}.cell.zS{background:var(--zoneS)}.cell.zW{background:var(--zoneW)}
.cell.corner{background:linear-gradient(135deg,#2a3a63,#15203c);border-color:var(--acc)}
.cell.node{border-color:var(--acc2)}
.cell.event{border-style:dashed;border-color:var(--vio)}
.cell.owned{box-shadow:inset 0 0 0 2px var(--pc),0 2px 0 var(--pc),0 4px 6px rgba(0,0,0,.5)}
.cell .df{position:absolute;right:1px;top:1px;font-size:7px;letter-spacing:-1px}
.cell .emp{position:absolute;inset:0;border-radius:5px;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(181,140,255,.3) 3px 5px);pointer-events:none;animation:flick .4s steps(2) infinite}
@keyframes flick{to{opacity:.4}}
.cell.inrange{outline:1.5px solid var(--acc);outline-offset:-1px;animation:holo 1.2s ease-in-out infinite}
.cell.inrange::before{content:attr(data-d);position:absolute;right:2px;bottom:1px;font-size:7px;color:var(--acc)}
.cell.target{outline:2px solid var(--red);animation:holo .6s ease-in-out infinite}
.cell.hit{animation:hit .5s ease-out}
.cell.guer{box-shadow:inset 0 0 0 2px var(--red),0 2px 0 var(--red)}
@keyframes holo{0%,100%{box-shadow:0 2px 0 #050810,0 0 0 0 rgba(79,209,255,0)}50%{box-shadow:0 2px 0 #050810,0 0 10px 2px rgba(79,209,255,.5)}}
@keyframes hit{0%{background:#ff5c7a;transform:scale(1.15)}100%{transform:scale(1)}}
/* 건물 타워(세워진 블록) */
.bld{position:absolute;left:2px;bottom:2px;display:flex;gap:1px;align-items:flex-end;transform-origin:bottom;transform:rotateX(calc(-1*var(--tilt)));pointer-events:none}
.bld i{width:4px;background:linear-gradient(180deg,#fff8,var(--pc) 40%,color-mix(in srgb,var(--pc) 50%,#000));border-radius:1px 1px 0 0;box-shadow:1px 1px 0 #0008}
/* 실드 돔 */
.dome{position:absolute;inset:-1px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(79,209,255,.35),rgba(79,209,255,.05) 60%,transparent 70%);border:1px solid rgba(79,209,255,.5);pointer-events:none;animation:domeb 2.4s ease-in-out infinite}
.dome.flash{animation:domef .7s}
@keyframes domeb{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes domef{0%{background:#4fd1ffcc;transform:scale(1.1)}100%{transform:scale(1)}}
/* 말(세워진 핀) */
.tok{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px;transform-style:preserve-3d}
.tok i{display:block;width:9px;height:9px;border-radius:50% 50% 50% 0;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 45%,color-mix(in srgb,var(--pc) 55%,#000));transform:rotate(-45deg) rotateX(calc(-1*var(--tilt)));transform-origin:bottom left;box-shadow:0 0 6px var(--pc);animation:bob 1.6s ease-in-out infinite}
.tok i.cur{width:11px;height:11px;animation:bob .9s ease-in-out infinite}
.tok i.g{border-radius:2px;background:var(--red);transform:rotateX(calc(-1*var(--tilt)));animation:none}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2px}}

/* ---------- 콘솔 ---------- */
#console{grid-column:2/11;grid-row:2/19;margin:3px;background:#0e1529f2;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;position:relative;z-index:1}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:none;border-radius:0;background:transparent;color:var(--dim);padding:6px 0;font-size:11px;position:relative}
#tabs button.on{color:var(--acc)}
#tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:2px;background:var(--acc)}
#panes{flex:1;overflow:auto;padding:6px;font-size:11px;line-height:1.45;min-height:0}
.pane{display:none}.pane.on{display:block}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.btns button{flex:1 1 45%}
#dice{display:flex;gap:6px;align-items:center;margin:4px 0}
.die{width:30px;height:30px;border-radius:7px;background:#fff;color:#06101f;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #9aa,0 5px 8px #0008}
.die.roll{animation:spin .5s linear}
@keyframes spin{to{transform:rotate(360deg)}}
#log{font-size:10px;color:var(--dim);border-top:1px dashed var(--line);margin-top:6px;padding-top:4px;max-height:38%;overflow:auto}
#log div{padding:1px 0}
#log .c0{color:var(--p0)}#log .c1{color:var(--p1)}#log .c2{color:var(--p2)}#log .c3{color:var(--p3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;margin:4px 0}
.card h4{font-size:11px;color:var(--acc);margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:10px}
.kv span:nth-child(odd){color:var(--dim)}
.cmp{width:100%;border-collapse:collapse;font-size:10px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:2px 3px;text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.q{border-left:3px solid var(--acc2);padding-left:6px;margin:4px 0}
.rule h5{color:var(--acc2);margin:6px 0 2px;font-size:11px}
.rule p{color:#c5d2f2;margin-bottom:3px}
.hint{color:var(--acc);font-size:10px}
.chain{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:3px 0}
.chain span{background:#0d1428;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10px;animation:chipin .35s both}
.chain span.bad{border-color:var(--red)}.chain span.good{border-color:var(--grn)}
.chain em{color:var(--acc2);font-style:normal;animation:chipin .35s both}
@keyframes chipin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.newsbar{background:linear-gradient(90deg,#2a1d4f,#16203a);border:1px solid var(--vio);border-radius:8px;padding:5px 7px;font-size:10px;margin:4px 0;animation:chipin .5s}
.newsbar b{color:var(--vio)}

/* ---------- 이펙트 ---------- */
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2;transform:translateZ(2px)}
#fxlayer{position:absolute;inset:0;pointer-events:none;transform:translateZ(6px);transform-style:preserve-3d;z-index:9}
#fx path{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:5 4;animation:dash .6s linear infinite;filter:drop-shadow(0 0 4px var(--red))}
#fx path.emp{stroke:var(--vio)}#fx path.ok{stroke:var(--grn)}
@keyframes dash{to{stroke-dashoffset:-18}}
#fxtop{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:visible}
#fxtop path{fill:none;stroke:var(--acc2);stroke-width:1.5;stroke-dasharray:4 4;animation:dash .5s linear infinite;filter:drop-shadow(0 0 3px var(--acc2))}
.missile{position:absolute;left:0;top:0;width:14px;height:6px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,#999,#fff);box-shadow:0 0 6px #fff;z-index:5;pointer-events:none;transform-origin:center}
.missile::before{content:"";position:absolute;left:-9px;top:1px;width:9px;height:4px;border-radius:4px 0 0 4px;background:linear-gradient(90deg,transparent,#ffb648,#ff5c7a);filter:blur(.5px)}
.missile.emp{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff,var(--vio));box-shadow:0 0 10px var(--vio)}
.missile.emp::before{display:none}
.mshadow{position:absolute;width:10px;height:4px;border-radius:50%;background:#0009;z-index:3;pointer-events:none}
.trail{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd48a;box-shadow:0 0 5px #ffb648;z-index:4;pointer-events:none;animation:trailf .5s ease-out forwards}
.trail.v{background:#d9c6ff;box-shadow:0 0 5px var(--vio)}
@keyframes trailf{to{opacity:0;transform:scale(.2)}}
.boom{position:absolute;width:10px;height:10px;border-radius:50%;z-index:6;pointer-events:none;background:radial-gradient(circle,#fff 0%,#ffd48a 30%,#ff5c7a 60%,transparent 70%);animation:boom .6s ease-out forwards}
.boom.big{animation:boomBig .9s ease-out forwards}
.boom.blue{background:radial-gradient(circle,#fff,#4fd1ff 50%,transparent 70%)}
.boom.vio{background:radial-gradient(circle,#fff,var(--vio) 50%,transparent 70%)}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
@keyframes boomBig{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(9);opacity:0}}
.ring{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--vio);z-index:6;pointer-events:none;animation:ring 1s ease-out forwards}
.ring.r{border-color:var(--red)}.ring.b{border-color:var(--acc)}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
.deb{position:absolute;width:3px;height:3px;background:#ffb648;border-radius:1px;z-index:6;pointer-events:none;animation:deb .7s ease-out forwards}
@keyframes deb{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
.tracer{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#5ef2a2);transform-origin:left center;z-index:5;pointer-events:none;animation:tracer .25s linear forwards}
@keyframes tracer{from{opacity:1;transform:rotate(var(--ang)) scaleX(0)}to{opacity:1;transform:rotate(var(--ang)) scaleX(1)}}
.beam{position:absolute;width:6px;background:linear-gradient(180deg,transparent,#fff,#4fd1ff);transform-origin:bottom;z-index:6;pointer-events:none;animation:beam .5s ease-in forwards;box-shadow:0 0 12px #4fd1ff}
@keyframes beam{from{transform:translateX(-50%) scaleY(0);opacity:0}to{transform:translateX(-50%) scaleY(1);opacity:1}}
.coin{position:fixed;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd93d 40%,#b8860b);box-shadow:0 0 5px #ffd93d;z-index:71;pointer-events:none}
.warp{position:absolute;width:30px;height:30px;border-radius:50%;border:2px dashed var(--vio);z-index:6;pointer-events:none;animation:warp .8s ease-out forwards}
@keyframes warp{from{transform:translate(-50%,-50%) rotate(0) scale(1.2);opacity:1}to{transform:translate(-50%,-50%) rotate(360deg) scale(.1);opacity:0}}
.toast{position:absolute;z-index:8;background:#06101f;border:1px solid var(--acc);color:var(--txt);font-size:10px;padding:3px 6px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);animation:pop 1.8s ease-out forwards;pointer-events:none}
.toast.bad{border-color:var(--red)}.toast.good{border-color:var(--grn)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-80%)}15%{opacity:1;transform:translate(-50%,-130%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%)}}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:#06101fee;border:1px solid var(--vio);border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;color:var(--txt);z-index:65;animation:bann 2.2s ease-out forwards;pointer-events:none;text-align:center;max-width:90vw}
#banner small{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:3px}
@keyframes bann{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(3,6,14,.75);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;max-width:380px;width:100%;max-height:85vh;overflow:auto;font-size:12px;line-height:1.5}
#modal h3{color:var(--acc);font-size:14px;margin-bottom:6px}
#modal .btns button{flex:1 1 100%}
#modal .btns.row button{flex:1 1 30%}

@media (orientation:landscape){
  #app{flex-direction:row}
  #top{width:var(--sidew);justify-content:flex-start}
  #chips{grid-template-columns:1fr 1fr}
  #board{grid-template-columns:repeat(19,var(--cell));grid-template-rows:repeat(11,var(--cell))}
  #console{grid-column:2/19;grid-row:2/11}
  #stage{perspective-origin:50% 50%}
}
</style>
</head>
<body>

<div id="setup">
  <h1>BLUEMARBLE TACTICS<small>LEVEL 5 · 전선의 지배자들</small></h1>
  <p class="sub">11×19 전장 · 주사위 눈 = 미사일 사거리 · 골드와 전술 AP의 이중 재화.<br>사령관을 고르고 전선을 장악하세요.</p>
  <div class="pcfg" id="pcfg"></div>
  <div class="cmdinfo" id="cmdinfo"></div>
  <div class="btns" style="width:100%;max-width:380px">
    <button class="pri" onclick="startGame(false)">▶ 게임 시작</button>
    <button onclick="startGame(true)">🎓 튜토리얼로 시작</button>
  </div>
</div>

<div id="app" class="hide">
  <div id="top">
    <div id="title"><span>BLUEMARBLE TACTICS · <b>LV5</b></span><span class="ctl"><span id="tiltbtn" onclick="toggleTilt()">2.5D</span><span id="sound" onclick="toggleSound()">🔇</span></span></div>
    <div id="status"></div>
    <div id="chips"></div>
  </div>
  <div id="stage"><div id="board">
    <div id="console">
      <div id="tabs">
        <button class="on" data-t="act" onclick="tab('act')">행동</button>
        <button data-t="war" onclick="tab('war')">전황</button>
        <button data-t="quest" onclick="tab('quest')">퀘스트</button>
        <button data-t="rule" onclick="tab('rule')">규칙</button>
      </div>
      <div id="panes">
        <div class="pane on" id="p-act"></div>
        <div class="pane" id="p-war"></div>
        <div class="pane" id="p-quest"></div>
        <div class="pane rule" id="p-rule"></div>
        <div id="log"></div>
      </div>
    </div>
    <svg id="fx"></svg>
    <div id="fxlayer"></div>
  </div></div>
</div>
<svg id="fxtop"></svg>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>

<script>
/* ============================================================
   데이터
============================================================ */
const N=56, LONG=19, SHORT=11, ROUNDS=15;
const PC=['#4fd1ff','#ff8a5c','#5ef2a2','#ffd93d'];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
// 덱: 다 쓰면 다시 섞되, 직전 카드가 맨 앞에 오지 않게
class Deck{constructor(items){this.items=items;this.pile=[];this.last=null}
  draw(){if(!this.pile.length){this.pile=shuffle(this.items);if(this.pile.length>1&&this.pile[this.pile.length-1]===this.last){this.pile.unshift(this.pile.pop())}}const x=this.pile.pop();this.last=x;return x}
  peek(n){while(this.pile.length<n){this.pile=shuffle(this.items).concat(this.pile)}return this.pile.slice(-n).reverse()}}

function diceBag(p){if(!p.bag||!p.bag.length){p.bag=shuffle([...Array(36)].map((_,i)=>[1+(i%6),1+Math.floor(i/6)]))}
  let d=p.bag.pop();if(p.bag.length&&d[0]+d[1]===p.lastTotal){const alt=p.bag.pop();p.bag.push(d);d=alt}p.lastTotal=d[0]+d[1];return d}

function isLand(){return innerWidth>innerHeight}
function vh(){return (window.visualViewport?window.visualViewport.height:innerHeight)}
function layout(){
  const land=isLand(),topEl=document.getElementById('top');
  let c;
  if(land){
    const sidew=Math.max(200,Math.min(260,innerWidth*0.25));
    document.documentElement.style.setProperty('--sidew',sidew+'px');
    c=Math.min((innerWidth-sidew-16-(LONG+1)*2)/LONG,(vh()-14-(SHORT+1)*2)/SHORT);
  }else{
    const th=topEl.getBoundingClientRect().height||120;
    c=Math.min((innerWidth-8-(SHORT+1)*2)/SHORT,(vh()-th-12-(LONG+1)*2)/LONG);
  }
  c=Math.max(20,Math.floor(c*10)/10);
  document.documentElement.style.setProperty('--cell',c+'px');
  document.documentElement.style.setProperty('--tilt',tilt?(land?'20deg':'14deg'):'0deg');
  document.documentElement.style.setProperty('--bscale',1);
  requestAnimationFrame(fitTilt);
}
function fitTilt(){const st=document.getElementById('stage').getBoundingClientRect(),br=B().getBoundingClientRect();const s=Math.min(1,(st.height-6)/br.height,(st.width-4)/br.width);document.documentElement.style.setProperty('--bscale',Math.floor(s*100)/100)}
addEventListener('resize',()=>{layout();drawFx(null)});
if(window.visualViewport)window.visualViewport.addEventListener('resize',layout);
if(window.ResizeObserver){new ResizeObserver(()=>layout()).observe(document.getElementById('top'))}
function toggleTilt(){tilt=!tilt;applyTilt();layout()}
function applyTilt(){document.getElementById('tiltbtn').textContent=tilt?'2.5D':'2D';document.getElementById('tiltbtn').style.color=tilt?'var(--acc)':'var(--dim)'}
function rc(i){let r,c;if(i<=10){r=0;c=i}else if(i<=28){c=10;r=i-10}else if(i<=38){r=18;c=38-i}else{c=0;r=56-i}if(isLand())return{r:c,c:18-r};return{r,c}}

const B=()=>document.getElementById('board');

// 미사일 비행: 출발칸 → 보드 중앙을 가로질러 → 목표칸. 포물선 고도 + 그림자 + 꼬리. onMid: 65% 지점 콜백(요격 판정)
function fly(from,to,type,opt,done){
  if(window.FAST){done&&done();return}
  const [x1,y1]=cxy(from),[x2,y2]=cxy(to),[mx,my]=bcenter();
  const cxp=(x1+x2)/2*0.4+mx*0.6, cyp=(y1+y2)/2*0.4+my*0.6; // 제어점: 보드 중앙 쪽으로
  const m=spawn('missile '+(type==='emp'?'emp':''),0,0), sh=spawn('mshadow',0,0);
  const dur=opt.dur||950, H=opt.h||70, t0=performance.now();let midDone=false,last=0,stopped=false;
  const stopAt=opt.stopAt||1;
  function f(now){
    if(stopped)return;
    let t=Math.min(1,(now-t0)/dur);
    const u=1-t,gx=u*u*x1+2*u*t*cxp+t*t*x2,gy=u*u*y1+2*u*t*cyp+t*t*y2;
    const alt=Math.sin(Math.PI*t)*H;
    const dx=2*(1-t)*(cxp-x1)+2*t*(x2-cxp),dy=2*(1-t)*(cyp-y1)+2*t*(y2-cyp);
    const ang=Math.atan2(dy-Math.cos(Math.PI*t)*H*0.6,dx)*180/Math.PI;
    m.style.transform=`translate(${gx-7}px,${gy-alt-3}px) rotate(${ang}deg) scale(${1+alt/120})`;
    sh.style.transform=`translate(${gx-5}px,${gy-2}px) scale(${1-alt/160})`;sh.style.opacity=.6-alt/200;
    if(now-last>28){last=now;spawn('trail '+(type==='emp'?'v':''),gx,gy-alt,500)}
    if(!midDone&&t>=0.62&&opt.onMid){midDone=true;if(opt.onMid(gx,gy-alt)){stopped=true;m.remove();sh.remove();return}}
    if(t<stopAt)requestAnimationFrame(f);else{m.remove();sh.remove();done&&done(gx,gy)}
  }
  requestAnimationFrame(f);
}
function flyCoins(fromEl,toEl,n,cls='coin'){if(window.FAST||!fromEl||!toEl)return;const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();for(let k=0;k<n;k++){setTimeout(()=>{const e=document.createElement('div');e.className=cls;document.body.appendChild(e);const x1=a.left+a.width/2,y1=a.top+a.height/2,x2=b.left+b.width/2,y2=b.top+b.height/2,t0=performance.now();const f=now=>{const t=Math.min(1,(now-t0)/600),u=1-t;e.style.transform=`translate(${x1+(x2-x1)*t}px,${y1+(y2-y1)*t-Math.sin(Math.PI*t)*40}px)`;e.style.opacity=1-t*.3;if(t<1)requestAnimationFrame(f);else e.remove()};requestAnimationFrame(f)},k*80)}}

function banner(t,s){if(window.FAST)return;const old=document.getElementById('banner');if(old)old.remove();const e=document.createElement('div');e.id='banner';e.innerHTML=t+(s?`<small>${s}</small>`:'');document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}

function rangeMod(p){let m=p.rangeBonus+(p.cmd==='V'?2:0)+(cell(10).owner===p.id?1:0)+(cell(p.pos).type==='node'&&cell(p.pos).owner===p.id?1:0)-p.rangePen;if(weather.k==='storm')m-=2;if(weather.k==='fog')m+=1;if(news&&news.k==='magnet')m-=1;return m}

function roll(){
  if(busy||phase!=='roll')return;busy=true;
  const p=P[cur];dice=diceBag(p);sfx.dice();
  {const t=dice[0]+dice[1];st('dice',t);STATS.rolls++;if(STATS.prevTotal[p.id]===t)STATS.rep++;STATS.prevTotal[p.id]=t}

  const step=()=>{p.pos=(p.pos+dir+N)%N;n++;if(p.pos===0&&dir===1)passStart(p);updateBoard();if(n<steps)setTimeout(step,T(70));else{busy=false;landed(p)}};

   <div class="kv"><span>가격</span><span>${fmt(price)}</span><span>통행료</span><span>${fmt(tollOf(c))} (0단계)</span>${c.i===10?'<span>효과</span><span>전 미사일 사거리 +1</span>':''}${c.i===38?'<span>효과</span><span>매 턴 AP +1</span>':''}</div>

}
function blackMarket(p){
  const card=bmDeck.draw();log(`${p.name} 블랙마켓 카드: ${card.n}`,p.id);st('card',card.k);
  if(p.bot){applyCard(p,card);afterLand(p);return}
  _go=()=>{closeModal();applyCard(p,card);afterLand(p)};
  modal(`<h3>🕶️ 블랙마켓</h3><div class="card"><h4>${card.n}</h4>${card.d}</div><div class="btns"><button class="pri" onclick="_go()">사용</button></div>`);

function applyCard(p,card){
  const t=leader(p);
  if(card.k==='orbit'){const s=rnd(N);for(let k=0;k<4;k++)setTimeout(()=>orbitalStrike((s+k)%N,'위성 타격'),T(k*220))}
  if(card.k==='jam'&&t){t.reverse=true;log(`${t.name} 다음 턴 역주행`,t.id);chipDelta(t.id,'역주행','m')}
  if(card.k==='freeze'&&t){t.frozen=1;log(`${t.name} 자산 1라운드 동결`,t.id);chipDelta(t.id,'동결','m')}
  if(card.k==='decoy'&&t){const tc=cities(t)[0];if(tc){guer=(tc.i+1)%N;log(`게릴라가 ${t.name} 영토 옆으로 유인됨`);toast(guer,'게릴라 이동','bad');updateBoard()}}
  if(card.k==='arms'){p.ap+=3;chipDelta(p.id,'AP+3','p')}
  if(card.k==='spy'&&t){const tc=cities(t).filter(c=>c.def.shield||c.def.ciws||c.def.jammer)[0];if(tc){tc.def={shield:0,ciws:0,jammer:0};toast(tc.i,'방어 제거','bad');log(`${t.name} ${tc.name} 방어 시설 제거`);updateBoard()}}
  if(card.k==='insur'){p.gold+=300;chipDelta(p.id,'+₲300','p')}
  if(card.k==='leak'&&t){t.rangePen=3;log(`${t.name} 다음 턴 사거리 −3`,t.id);chipDelta(t.id,'사거리−3','m')}
}
function orbitalStrike(i,why){if(!window.FAST){const [x,y]=cxy(i);spawn('beam',x,y-160,600,{height:'160px'});setTimeout(()=>{boom(x,y,'big blue',8);shake()},T(450))}setTimeout(()=>neutralize(i,why),T(450))}
function neutralize(i,why){const c=cell(i);if(c.price===0)return;if(c.owner!==null||c.lvl||c.def.shield||c.def.ciws||c.def.jammer){const o=c.owner;c.owner=null;c.lvl=0;c.def={shield:0,ciws:0,jammer:0};toast(i,'중화','bad');if(o!==null){log(`${c.name} ${why}로 중화 (${P[o].name} 소유권 상실)`);linkToChip(i,o);chipDelta(o,'도시 −1','m')}updateBoard()}}

function hintAttack(){msg('보드에서 <em>하이라이트된 적 도시</em>(또는 💀 게릴라)를 누르세요')}
function canTarget(p,c){
  if(news&&news.k==='truce')return false;
  const d=dist(p.pos,c.i);
  if(c.owner===null||c.owner===p.id)return c.i===guer&&d<=range;
  if(d>range)return false;
  if(c.def.jammer&&d>3&&weather.k!=='fog')return false;
  if(P[c.owner].immune>0)return false;
  return true;
}
function tapCell(i){
  const p=P[cur],c=cell(i);if(p.bot||busy)return;
  if(orbitalMode){orbitalMode=false;p.orbital--;STATS.orbital++;orbitalStrike(i,'궤도 타격');log(`${p.name} 궤도 타격 → ${c.name}`,p.id);renderAct();return}
  if(bombMode){
    const okN=c.owner===null&&c.price>0;const okE=c.owner!==null&&c.owner!==p.id&&c.lvl===Math.min(...cities(P[c.owner]).map(x=>x.lvl));
    if(!(okN||okE)){msg('빈 거점 또는 상대의 최하위 단계 도시만 가능합니다');return}

function build(k,i,m){const p=P[cur],c=cell(i);const cost=Math.round(DEF[k].c*m);if(p.gold<cost)return;p.gold-=cost;c.def[k]=1;sfx.coin();log(`${p.name} ${c.name}에 ${DEF[k].n} 설치 ${fmt(cost)}`,p.id);toast(i,DEF[k].ic+' 설치','good');if(cost)chipDelta(p.id,'−'+fmt(cost),'m');closeModal();updateBoard();renderAct();if(!window.FAST&&k==='shield'){const d=document.querySelector('#c'+i+' .dome');if(d){d.classList.add('flash')}}if(pendingLand){pendingLand=false;afterLand(p)}}
function upgrade(i){const p=P[cur],c=cell(i);const up=Math.round(c.price*.5);p.gold-=up;c.lvl++;sfx.coin();log(`${p.name} ${c.name} ${c.lvl}단계 증축`,p.id);toast(i,'증축 '+c.lvl,'good');chipDelta(p.id,'−'+fmt(up),'m');closeModal();updateBoard();renderAct();checkQuest(p)}

function killGuer(p){
  p.ap-=2;STATS.guerKill++;attacked=true;const g=guer;sfx.launch();
  fly(p.pos,g,'missile',{},(x,y)=>{boom(x,y,'',8);shake();sfx.hit();const mul=news&&news.k==='bounty'?2:1;toast(g,'게릴라 소탕','good');log(`${p.name} 게릴라 소탕! ₲${300*mul} + AP${2*mul}`,p.id);guer=-1;p.gold+=300*mul;p.ap+=2*mul;p.st.terror++;chipDelta(p.id,`+₲${300*mul}`,'p');chain('🚀 미사일','💀 게릴라 소탕',`보상 ₲${300*mul}+AP${2*mul}`);checkQuest(p);updateBoard();renderAct();if(p.bot)setTimeout(endTurn,T(500))});
}
function attack(p,i,w){
  const c=cell(i),o=P[c.owner],d=dist(p.pos,i);
  const cost=w==='missile'?2:w==='emp'?3-(p.cmd==='P'?1:0):4;
  p.ap-=cost;attacked=true;st('atk',w);chipDelta(p.id,'AP−'+cost,'m');sfx.launch();
  const label=w==='missile'?'🚀 미사일':w==='emp'?'⚡ EMP':'💥 정밀 포격';
  const steps=[`${label} ${d}칸`];
  const canCiws=c.def.ciws&&c.emp===0&&weather.k!=='solar'&&w==='missile';
  const intercept=canCiws&&Math.random()<.5;
  const finish=res=>{
    document.getElementById('c'+i).classList.add('hit');setTimeout(()=>document.getElementById('c'+i).classList.remove('hit'),500);
    steps.push(res);chain(...steps);st('res',res.split(' ')[0]);
    log(`${p.name} → ${o.name} ${c.name}: ${steps.join(' → ')}`,p.id);
    linkToChip(i,o.id);checkQuest(p);updateBoard();renderAct();
    if(p.bot)setTimeout(endTurn,T(500));
  };
  const opt={onMid:(mx,my)=>{ if(intercept){ // 요격 포탑 트레이서 → 공중 폭발
      const [tx,ty]=cxy(i);const len=Math.hypot(mx-tx,my-ty),ang=Math.atan2(my-ty,mx-tx)*180/Math.PI;
      spawn('tracer',tx,ty,300,{width:len+'px','--ang':ang+'deg'});
      setTimeout(()=>{boom(mx,my,'',5);sfx.block();toast(i,'요격!','good');finish('요격 포탑이 요격')},T(230));
      return true}return false}};
  if(w==='strike'){ // 3연발
    [0,160,320].forEach((dl,k)=>setTimeout(()=>fly(p.pos,i,'missile',{dur:800,h:90},(x,y)=>{boom(x,y,k===2?'big':'',6);if(k===2){shake();sfx.hit();ringAt(x,y,'r',2);
      c.owner=null;c.lvl=0;c.def={shield:0,ciws:0,jammer:0};p.st.hits++;if(d>=9)p.st.long++;toast(i,'초토화','bad');chipDelta(o.id,'도시 −1','m');finish('도시 무주공산')}}),T(dl)));
    return;
  }
  fly(p.pos,i,w,opt,(x,y)=>{
    if(w==='emp'){c.emp=2;sfx.emp();ringAt(x,y,'',3);spawn('boom vio',x,y,700);if(c.def.shield||c.def.ciws)p.st.emps++;toast(i,'EMP 마비','bad');finish('방어·통행료 2R 마비');return}
    if(c.def.shield&&c.emp===0){c.def.shield=0;sfx.block();const dm=document.querySelector('#c'+i+' .dome');if(dm)dm.classList.add('flash');spawn('boom blue',x,y,700);o.st.abs++;toast(i,'실드 흡수','good');checkQuest(o);finish('실드가 흡수 (실드 소멸)');return}
    boom(x,y,'',8);shake();sfx.hit();
    let res;if(c.lvl>0){c.lvl--;res=`건물 −1 (${c.lvl}단계)`}else{const g=Math.min(o.gold,Math.round(c.price*.4*(p.cmd==='V'?2:1)));o.gold-=g;res=`골드 피해 ${fmt(g)}`;chipDelta(o.id,'−'+fmt(g),'m')}
    p.st.hits++;if(d>=9)p.st.long++;toast(i,res,'bad');finish(res);
  });
}
function useSkill(){
  const p=P[cur],k=p.cmd;if(p.ap<CMDS[k].ap||p.cd>0)return;
  p.ap-=CMDS[k].ap;p.cd=4;st('skill',k);chipDelta(p.id,'AP−'+CMDS[k].ap,'m');
  if(k==='V'){const tg=cells.filter(c=>c.owner!==null&&c.owner!==p.id&&dist(p.pos,c.i)<=range&&c.lvl>0&&P[c.owner].immune===0);tg.forEach((c,n)=>setTimeout(()=>fly(p.pos,c.i,'missile',{dur:700,h:60},(x,y)=>{boom(x,y,'',4);c.lvl--;toast(c.i,'−1','bad');updateBoard()}),T(n*180)));log(`${p.name} 전면 포격: 적 도시 ${tg.length}곳 건물 −1`,p.id);banner('🎯 전면 포격!',`적 도시 ${tg.length}곳 타격`)}

  if(k==='T'){log(`${p.name} 긴급 보급: 주사위 한 번 더`,p.id);phase='roll';dice=[0,0];clearRange();renderAct();return}

function endTurn(){if(busy)return;closeModal();clearRange();drawFx(null);const p=P[cur];p.immune=0;checkQuest(p);nextTurn()}
function nextTurn(){let n=0;do{cur=(cur+1)%P.length;n++}while(!P[cur].alive&&n<P.length);if(cur===alive()[0].id)endRound();else beginTurn()}
function endRound(){
  if(guer>=0){
    alive().forEach(p=>{if(dist(p.pos,guer)<=3&&!p.resist){const g=Math.min(150,Math.round(p.gold*.1));p.gold-=g;log(`💀 게릴라가 ${p.name} 갈취 ${fmt(g)}`);toast(p.pos,'갈취','bad');chipDelta(p.id,'−'+fmt(g),'m')}});
    cells.forEach(c=>{if(c.owner!==null&&dist(c.i,guer)<=3&&c.emp===0&&Math.random()<.4){c.emp=1;toast(c.i,'게릴라 교란','bad')}});
  }
  cells.forEach(c=>{if(c.emp>0)c.emp--});P.forEach(p=>{if(p.frozen>0)p.frozen--});
  const rw=alive().find(p=>p.resist&&nodes(p).length>=3);if(rw){gameOver(rw,'레지스탕스가 전략 거점 3곳을 장악');return}
  round++;if(round>ROUNDS){gameOver(null,'15라운드 종료');return}
  if(round%3===0){setWeather();log(`🌦 기상 변화: ${weather.n} — ${weather.d}`);banner(`${weather.ic} ${weather.n}`,weather.d)}
  if(round%3===2&&guer<0)spawnGuer();
  // 전장 뉴스 (매 라운드, 덱 순환)
  news=newsDeck.draw();st('news',news.k);applyNews(news);
  if(round===6||round===13)log(round===6?'🎵 중반 교전 — BGM 템포 상승':'🎵 클라이맥스 — 경보 믹스');
  updateBoard();beginTurn();
}
function spawnGuer(){
  const zones=['N','E','S','W'].filter(z=>z!==lastGuerZone);const z=zones[rnd(zones.length)];
  const empty=cells.filter(c=>c.zone===z&&c.owner===null&&c.price>0&&!alive().some(p=>p.pos===c.i));
  guer=empty.length?empty[rnd(empty.length)].i:21;lastGuerZone=cell(guer).zone;
  log(`💀 게릴라 출현: ${cell(guer).name}`);toast(guer,'게릴라 출현','bad');banner('💀 게릴라 출현',cell(guer).name);
}
function applyNews(nw){
  log(`📰 전장 뉴스: ${nw.n} — ${nw.d}`);setTimeout(()=>banner(`${nw.ic} ${nw.n}`,nw.d),T(round%3===0?1200:0));
  if(nw.k==='convoy')alive().forEach(p=>{p.ap+=1;chipDelta(p.id,'AP+1','p')});
  if(nw.k==='cyber'){const owned=shuffle(cells.filter(c=>c.owner!==null)).slice(0,2);owned.forEach(c=>{c.emp=Math.max(c.emp,1);toast(c.i,'사이버 공격','bad')})}
  if(nw.k==='airdrop'){const p=alive()[rnd(alive().length)];p.gold+=300;chipDelta(p.id,'+₲300','p');log(`🪂 ${p.name} 물자 낙하 ₲300`,p.id)}
}

function bankruptCheck(p,next){
  while(p.gold<0&&cities(p).length){const c=cities(p).sort((a,b)=>a.price-b.price)[0];p.gold+=Math.round(c.price*.5);log(`${p.name} ${c.name} 매각 (${fmt(Math.round(c.price*.5))})`,p.id);c.owner=null;c.lvl=0;c.def={shield:0,ciws:0,jammer:0};toast(c.i,'매각','bad')}
  if(p.gold<0){
    if(!p.resist){p.resist=true;p.gold=0;p.bomb=1;STATS.resist++;log(`🏴 ${p.name} 파산 직전 → 레지스탕스 모드! 통행료 면제 + 거점 점령 폭탄 1회. 전략 거점 3곳 보유 시 승리`,p.id);banner('🏴 레지스탕스 봉기',`${p.name} — 거점 3곳 장악 시 승리`);
      if(!p.bot)modal(`<h3>🏴 레지스탕스 모드</h3><p>퇴장하지 않습니다. 이제부터 통행료를 내지 않고, <b>거점 점령 폭탄</b> 1회로 빈 거점이나 상대의 최하위 도시를 기습 점령할 수 있습니다.<br><br>새 승리 조건: <b>전략 거점 3곳 보유</b>.</p><div class="btns"><button class="pri" onclick="closeModal()">계속</button></div>`)}
    else p.gold=0;
  }
  updateBoard();next&&next();
}

/* ---------- 퀘스트 ---------- */
function checkQuest(p){
  if(!p.quest)return;
  if(p.quest.chk(p)){const q=p.quest;q.do(p);p.qpts++;STATS.quest++;log(`🏆 ${p.name} 퀘스트 완료 [${q.txt}] → ${q.rw}`,p.id);toast(p.pos,'퀘스트 완료!','good');chipDelta(p.id,'🏆 '+q.rw,'p');banner(`🏆 ${p.name} 퀘스트 완료`,`${q.txt} → ${q.rw}`);p.st={hits:0,emps:0,abs:0,long:0,terror:0};p.quest=p.qdeck.draw();}
  renderQuest();renderWar();
}
function renderQuest(){if(window.FAST)return;
  document.getElementById('p-quest').innerHTML=P.map(p=>`<div class="q" style="border-color:${p.color}"><b style="color:${p.color}">${p.name}</b> · 완료 ${p.qpts}<br>${p.quest?`<span class="hint">[${p.quest.t}]</span> ${p.quest.txt} <span style="color:var(--acc2)">→ ${p.quest.rw}</span>`:''}</div>`).join('')+
  `<div class="card"><h4>퀘스트 라이브러리 (${QUESTS.length}종, 덱 순환)</h4>${QUESTS.map(q=>`<div style="font-size:10px">· ${q.txt} → ${q.rw}</div>`).join('')}</div>`;
}
function renderWar(){if(window.FAST)return;
  const rows=[['골드',p=>fmt(p.gold)],['AP',p=>p.ap],['도시',p=>cities(p).length],['거점',p=>nodes(p).length],['전선 도시',p=>cities(p).filter(c=>c.zone==='E').length],['방어 시설',p=>cities(p).reduce((s,c)=>s+c.def.shield+c.def.ciws+c.def.jammer,0)],['사거리 보정',p=>(rangeMod(p)>=0?'+':'')+rangeMod(p)],['퀘스트',p=>p.qpts],['자산 점수',p=>score(p).toLocaleString()]];
  document.getElementById('p-war').innerHTML=`<table class="cmp"><tr><th></th>${P.map(p=>`<th style="color:${p.color}">${p.name.slice(0,4)}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${P.map(p=>`<td>${p.alive?r[1](p):'파산'}</td>`).join('')}</tr>`).join('')}</table>
  <div class="card"><h4>${weather.ic} ${weather.n}</h4>${weather.d} · 3라운드마다 변경 (5종 덱 순환, 연속 중복 없음)</div>
  ${news?`<div class="card" style="border-color:var(--vio)"><h4>${news.ic} 전장 뉴스: ${news.n}</h4>${news.d} · 이번 라운드만</div>`:''}
  ${guer>=0?`<div class="card" style="border-color:var(--red)"><h4>💀 게릴라 — ${cell(guer).name}</h4>라운드 말에 3칸 내 플레이어 골드 10% 갈취, 도시 교란. 사거리 안에서 미사일(AP2)로 소탕 시 ₲300+AP2</div>`:''}`;
}
function renderRule(){
  document.getElementById('p-rule').innerHTML=`
  <h5>🎯 핵심 규칙</h5><p>주사위 두 개 합만큼 이동하고, 같은 숫자(+보정)가 이번 턴 <b>미사일 사거리</b>가 됩니다. 거리는 보드 둘레를 따라 짧은 쪽으로 잽니다. 주사위는 36가지 조합을 다 쓸 때까지 같은 조합이 반복되지 않고, 직전 합과 같은 눈은 피합니다.</p>
  <h5>💰 이중 재화</h5><p><b>골드 ₲</b>: 도시·증축·방어 시설·통행료. <b>AP</b>: 미사일 2 · EMP 3 · 정밀 포격 4 · 스킬. 출발 통과 시 ₲200 + AP2, 보급창 점령 시 매 턴 AP+1, 퀘스트·게릴라 소탕으로 수급.</p>
  <h5>⚔️ 공격 / 방어</h5><p>미사일: 건물 −1(0단계면 골드 피해). EMP: 2라운드 방어·통행료 마비. 정밀 포격: 3연발, 실드 무시, 도시 무주공산.<br>실드 ₲100 1회 흡수 → 요격 포탑 ₲150 50% 요격 → 재머 ₲200 3칸 밖 조준 불가. EMP는 실드·요격을 마비, 재머는 근접하거나 전자 안개 때 뚫립니다.</p>
  <h5>📰 전장 뉴스 · 🌦 기상 · 🕶️ 블랙마켓</h5><p>매 라운드 전장 뉴스 1장(12종 덱)이 그 라운드의 규칙을 바꿉니다(휴전·군수 호황·현상금·금융 위기 등). 3라운드마다 기상(5종), 블랙마켓 칸에서 카드(8종). 모두 덱을 다 쓸 때까지 같은 것이 나오지 않습니다.</p>
  <h5>🏴 레지스탕스 · 💀 게릴라</h5><p>골드 0 이하 + 도시 0이면 퇴장 대신 레지스탕스: 통행료 면제, 거점 점령 폭탄 1회, 라운드 말에 전략 거점 3곳 보유 시 즉시 승리. 게릴라는 3라운드마다 직전과 다른 구역에 출현합니다.</p>
  <h5>🏆 승리</h5><p>15라운드 종료 시 골드 + 도시 가치 + 퀘스트×100 최고.</p>
  <h5>🎓 튜토리얼</h5><p>1 이동·매수 → 2 사거리 공격 → 3 실드·포탑 설치 → 4 EMP·궤도 타격. <button style="padding:2px 8px" onclick="tutorial=true;tutStep=0;showTut()">튜토리얼 열기</button> · 상단 2.5D 버튼으로 평면/입체 전환</p>`;
  renderQuest();renderWar();
}

/* ---------- AI ---------- */
function botTurn(){const p=P[cur];if(!p.alive||phase!=='roll')return;roll()}
function botAttack(){
  const p=P[cur],m=defCostMul(p,1);
  const need=cities(p).filter(c=>!c.def.shield).sort((a,b)=>b.price*(1+b.lvl)-a.price*(1+a.lvl))[0];
  if(need&&p.gold>Math.round(100*m)+500){p.gold-=Math.round(100*m);need.def.shield=1;log(`${p.name} ${need.name}에 실드 설치`,p.id);toast(need.i,'🛡 설치','good')}
  const upg=cities(p).filter(c=>c.type==='city'&&c.lvl<3&&c.zone==='E')[0];
  if(upg&&p.gold>upg.price*.5+700){p.gold-=Math.round(upg.price*.5);upg.lvl++;log(`${p.name} ${upg.name} 증축`,p.id)}
  if(p.resist&&p.bomb>0){const t=cells.find(c=>c.owner===null&&(c.type==='node'||c.type==='corner'))||cells.find(c=>c.owner===null&&c.price>0);if(t){p.bomb--;STATS.bomb++;t.owner=p.id;log(`💣 ${p.name} 기습 점령 → ${t.name}`,p.id);toast(t.i,'기습 점령','bad')}}
  if(p.orbital>0){const t=cells.filter(c=>c.owner!==null&&c.owner!==p.id).sort((a,b)=>b.lvl-a.lvl)[0];if(t){p.orbital--;STATS.orbital++;orbitalStrike(t.i,'궤도 타격');log(`${p.name} 궤도 타격 → ${t.name}`,p.id)}}
  const truce=news&&news.k==='truce';
  if(p.cd===0&&p.ap>=CMDS[p.cmd].ap){
    if(p.cmd==='A'&&cities(p).length>=3&&cells.some(c=>c.owner!==null&&c.owner!==p.id&&dist(p.pos,c.i)<=8)&&p.ap>=6)useSkill();
    else if(p.cmd==='P'&&leader(p)&&leader(p).ap>=4)useSkill();
    else if(!truce&&p.cmd==='V'&&cells.filter(c=>c.owner!==null&&c.owner!==p.id&&c.lvl>0&&dist(p.pos,c.i)<=range).length>=2)useSkill();
  }
  if(!truce&&guer>=0&&dist(p.pos,guer)<=range&&p.ap>=2){killGuer(p);return}
  const tg=cells.filter(c=>canTarget(p,c)&&c.owner!==null).sort((a,b)=>(b.lvl*100+b.price)-(a.lvl*100+a.price))[0];
  if(tg&&p.ap>=2){let w='missile';if(p.ap>=4&&tg.def.shield&&tg.lvl>=2)w='strike';else if(p.ap>=3&&(tg.def.shield||tg.def.ciws)&&weather.k!=='solar')w='emp';attack(p,tg.i,w);return}
  updateBoard();setTimeout(endTurn,T(600));
}

/* ---------- 모달 / 튜토리얼 / 종료 ---------- */
function modal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.remove('hide')}
function closeModal(){document.getElementById('modal').classList.add('hide')}
const TUT=[
 {t:'1단계 · 이동과 매수',b:'주사위를 굴려 이동합니다. 빈 도시에 서면 매수할 수 있습니다. 동쪽 전선(붉은 칸)은 비싸지만 통행료가 높고, 서쪽 백라인(녹색)은 안전합니다.'},
 {t:'2단계 · 사거리 공격',b:'주사위 합이 이번 턴 사거리입니다. 이동 뒤 파란 홀로그램이 켜진 칸이 사거리 안입니다. 적 도시를 눌러 미사일(AP2)을 쏘면 미사일이 보드를 가로질러 날아가 떨어집니다.'},
 {t:'3단계 · 방어 시설',b:'내 도시를 누르면 실드(1회 흡수, 파란 돔)·요격 포탑(50% 요격, 트레이서 발사)·재머(원거리 조준 불가)를 설치할 수 있습니다. 전선 도시에는 실드부터.'},
 {t:'4단계 · EMP와 궤도 타격',b:'실드가 있는 도시는 EMP(AP3)로 2라운드 마비시킨 뒤 미사일로 타격합니다. 백라인 도시 3개 퀘스트를 완료하면 궤도 타격권으로 어디든 초토화할 수 있습니다. 매 라운드 전장 뉴스가 규칙을 바꾸니 상단 보라색 태그를 확인하세요.'},
];
function showTut(){const s=TUT[tutStep];if(!s){tutorial=false;closeModal();return}modal(`<h3>🎓 ${s.t}</h3><p>${s.b}</p><div class="btns row"><button class="pri" onclick="tutStep++;showTut()">${tutStep<TUT.length-1?'다음':'시작!'}</button><button onclick="tutorial=false;closeModal()">건너뛰기</button></div>`)}
function tutHint(){const p=P[cur];const t=cells.find(c=>canTarget(p,c)&&c.owner!==null);msg(t?`🎓 <em>${t.short}</em>이(가) 사거리 안입니다. 눌러서 공격해 보세요`:'🎓 사거리 안에 적 도시가 없습니다. 내 도시에 방어 시설을 올리거나 턴을 종료하세요')}
function gameOver(w,why){
  const rank=P.slice().sort((a,b)=>score(b)-score(a));if(!w)w=rank[0];
  if(window.onGameOver){window.onGameOver({w:w.cmd,wn:w.name,why,round,scores:rank.map(p=>[p.cmd,score(p),cities(p).length,p.qpts,p.resist]),stats:STATS});return}
  modal(`<h3>🏆 ${w.name} 승리!</h3><p>${why}</p><table class="cmp">${rank.map((p,i)=>`<tr><td>${i+1}. <b style="color:${p.color}">${p.name}</b></td><td>${score(p).toLocaleString()}</td><td>도시 ${cities(p).length}</td><td>퀘스트 ${p.qpts}</td></tr>`).join('')}</table><div class="btns"><button class="pri" onclick="location.reload()">다시 하기</button></div>`);
}
buildSetup();
